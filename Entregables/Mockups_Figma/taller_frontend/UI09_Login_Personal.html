<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI-09: Inicio de Sesión de Personal (PIN Táctil & Credenciales) — PuraSed / Sereno Moreno</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0A0E0C;
      --bg-surface: #121815;
      --bg-card: #18221D;
      --border-subtle: rgba(245, 234, 219, 0.12);
      --border-amber: rgba(229, 159, 56, 0.4);
      --amber-sereno: #E59F38;
      --gold-highlight: #F8AD00;
      --terracotta: #C0392B;
      --text-cream: #FFF8ED;
      --text-muted: #D1C7BA;
      --text-dim: #7E7465;
      --font-display: 'Bebas Neue', 'Oswald', sans-serif;
      --font-body: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-cream);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(229, 159, 56, 0.1) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(192, 57, 43, 0.08) 0%, transparent 45%);
    }

    .bg-linocut {
      position: fixed;
      right: -20px;
      bottom: -20px;
      height: 70vh;
      opacity: 0.10;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
      z-index: 0;
    }

    /* Caja de Login */
    .login-box {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-amber);
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 32px 28px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.75);
      position: relative;
      z-index: 10;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-logo-text {
      font-family: var(--font-display);
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: var(--text-cream);
      line-height: 1;
    }
    .brand-logo-text span { color: var(--amber-sereno); }
    .brand-sub {
      font-family: 'Oswald', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Switch de Modalidad: PIN Táctil vs Credenciales */
    .login-tabs-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #0A0E0C;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 4px;
      margin-bottom: 22px;
    }
    .login-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px;
      border-radius: 4px;
      font-family: 'Oswald', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .login-tab-btn.active {
      background: var(--amber-sereno);
      color: #0A0E0C;
      font-weight: 700;
    }

    /* VISTA 1: TECLADO PIN TÁCTIL */
    .pin-display-box {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 22px;
    }
    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #0A0E0C;
      border: 2px solid var(--border-subtle);
      transition: all 0.2s ease;
    }
    .pin-dot.filled {
      background: var(--gold-highlight);
      border-color: var(--gold-highlight);
      box-shadow: 0 0 12px rgba(248, 173, 0, 0.6);
    }

    /* Teclado Numérico */
    .pin-keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 320px;
      margin: 0 auto 20px auto;
    }
    .keypad-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-cream);
      font-family: 'Oswald', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      height: 60px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      user-select: none;
    }
    .keypad-btn:hover {
      background: #24322B;
      border-color: var(--amber-sereno);
    }
    .keypad-btn:active {
      background: var(--amber-sereno);
      color: #0A0E0C;
      transform: scale(0.96);
    }
    .keypad-btn.action-btn {
      font-size: 1rem;
      letter-spacing: 0.5px;
    }

    /* VISTA 2: FORMULARIO CREDENCIALES */
    .creds-form-panel {
      display: none;
      flex-direction: column;
      gap: 14px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-family: 'Oswald', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .form-input {
      background: #0A0E0C;
      border: 1.5px solid var(--border-subtle);
      border-radius: 4px;
      padding: 12px 14px;
      color: var(--text-cream);
      font-family: var(--font-body);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: var(--amber-sereno);
    }

    .btn-login-submit {
      background: var(--amber-sereno);
      color: #0A0E0C;
      border: none;
      padding: 13px;
      border-radius: 4px;
      font-family: 'Oswald', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }
    .btn-login-submit:hover {
      background: var(--gold-highlight);
      transform: scale(1.02);
    }

    /* Selector Rápido de Personal para Demo */
    .quick-staff-selector {
      border-top: 1px dashed var(--border-subtle);
      margin-top: 20px;
      padding-top: 16px;
      text-align: center;
    }
    .quick-staff-title {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .quick-staff-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
    .staff-pill {
      background: #0A0E0C;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 4px 9px;
      border-radius: 12px;
      font-size: 0.74rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .staff-pill:hover {
      border-color: var(--amber-sereno);
      color: var(--gold-highlight);
    }
  </style>
</head>
<body>

  <!-- Linocut andino de fondo -->
  <img src="catalogo_imagenes/drawings/diablo-huma-emblem.png" class="bg-linocut" alt="Diablo Huma" />

  <article class="login-box">
    
    <div class="brand-header">
      <div class="brand-logo-text">SERENO <span>MORENO</span></div>
      <div class="brand-sub">Control de Acceso Operativo • PuraSed</div>
    </div>

    <!-- Switch de Modo -->
    <div class="login-tabs-row">
      <button type="button" class="login-tab-btn active" id="tabPinMode" onclick="setMode('pin')">
        PIN Táctil (Rápido)
      </button>
      <button type="button" class="login-tab-btn" id="tabCredsMode" onclick="setMode('creds')">
        Credenciales
      </button>
    </div>

    <!-- MODO 1: PIN TÁCTIL -->
    <div id="pinModeContainer">
      <div style="text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">
        Ingresa tu código PIN de 4 dígitos:
      </div>

      <div class="pin-display-box">
        <div class="pin-dot" id="dot0"></div>
        <div class="pin-dot" id="dot1"></div>
        <div class="pin-dot" id="dot2"></div>
        <div class="pin-dot" id="dot3"></div>
      </div>

      <div class="pin-keypad-grid">
        <button type="button" class="keypad-btn" onclick="pressDigit('1')">1</button>
        <button type="button" class="keypad-btn" onclick="pressDigit('2')">2</button>
        <button type="button" class="keypad-btn" onclick="pressDigit('3')">3</button>
        <button type="button" class="keypad-btn" onclick="pressDigit('4')">4</button>
        <button type="button" class="keypad-btn" onclick="pressDigit('5')">5</button>
        <button type="button" class="keypad-btn" onclick="pressDigit('6')">6</button>
        <button type="button" class="keypad-btn" onclick="pressDigit('7')">7</button>
        <button type="button" class="keypad-btn" onclick="pressDigit('8')">8</button>
        <button type="button" class="keypad-btn" onclick="pressDigit('9')">9</button>
        <button type="button" class="keypad-btn action-btn" onclick="clearPin()" style="color: var(--terracotta);">BORRAR</button>
        <button type="button" class="keypad-btn" onclick="pressDigit('0')">0</button>
        <button type="button" class="keypad-btn action-btn" onclick="submitPin()" style="color: var(--amber-sereno);">ENTRAR</button>
      </div>
    </div>

    <!-- MODO 2: CREDENCIALES -->
    <div class="creds-form-panel" id="credsModeContainer">
      <div class="form-group">
        <label class="form-label">Correo Institucional</label>
        <input type="email" class="form-input" id="inputEmail" value="mateo.v@serenomorenoec.com" placeholder="usuario@serenomorenoec.com" />
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña de Acceso</label>
        <input type="password" class="form-input" id="inputPass" value="••••••••" placeholder="Tu contraseña..." />
      </div>
      <button type="button" class="btn-login-submit" onclick="submitCreds()">
        INICIAR SESIÓN &rarr;
      </button>
    </div>

    <!-- Selector Rápido para Pruebas del Evaluador -->
    <div class="quick-staff-selector">
      <div class="quick-staff-title">Atajos de Prueba por Rol:</div>
      <div class="quick-staff-pills">
        <span class="staff-pill" onclick="simulateRole('Mateo V. (Mesero)')">👤 Mateo (Mesero - PIN: 1234)</span>
        <span class="staff-pill" onclick="simulateRole('David S. (Cocina)')">🍳 David (Cocina - PIN: 2222)</span>
        <span class="staff-pill" onclick="simulateRole('Andrés L. (Barra)')">🍺 Andrés (Barra - PIN: 3333)</span>
        <span class="staff-pill" onclick="simulateRole('Camila R. (Caja)')">💵 Camila (Caja - PIN: 4444)</span>
      </div>
    </div>

  </article>

  <script>
    let currentPin = '';

    function setMode(mode) {
      document.getElementById('tabPinMode').classList.toggle('active', mode === 'pin');
      document.getElementById('tabCredsMode').classList.toggle('active', mode === 'creds');
      document.getElementById('pinModeContainer').style.display = mode === 'pin' ? 'block' : 'none';
      document.getElementById('credsModeContainer').style.display = mode === 'creds' ? 'flex' : 'none';
    }

    function pressDigit(d) {
      if (currentPin.length < 4) {
        currentPin += d;
        updateDots();
        if (currentPin.length === 4) {
          setTimeout(submitPin, 200);
        }
      }
    }

    function clearPin() {
      currentPin = '';
      updateDots();
    }

    function updateDots() {
      for (let i = 0; i < 4; i++) {
        document.getElementById('dot' + i).classList.toggle('filled', i < currentPin.length);
      }
    }

    function submitPin() {
      if (currentPin.length === 4) {
        alert('✔ Acceso concedido con PIN táctil. Redirigiendo a estación operativa...');
        window.location.href = '06_Modulo_Caja_Administracion.html';
      } else {
        alert('Por favor ingresa los 4 dígitos de tu PIN.');
      }
    }

    function submitCreds() {
      alert('✔ Credenciales validadas exitosamente. Bienvenido a la administración.');
      window.location.href = '06_Modulo_Caja_Administracion.html';
    }

    function simulateRole(desc) {
      currentPin = '1234';
      updateDots();
      setTimeout(() => {
        alert(`✔ Acceso inmediato como ${desc}. Redirigiendo a la pantalla del rol...`);
        window.location.href = '06_Modulo_Caja_Administracion.html';
      }, 250);
    }
  </script>
</body>
</html>
