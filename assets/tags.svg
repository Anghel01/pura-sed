<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 232" width="100%" height="100%" role="img" aria-labelledby="tagsTitle tagsDesc">
  <title id="tagsTitle">Ecosistema Tecnol&#243;gico &#8212; PuraSed</title>
  <desc id="tagsDesc">Stack oficial de PuraSed en paleta Sereno Moreno: Frontend Blazor WASM, Backend .NET 10, SQL Server y Gesti&#243;n Scrum.</desc>
  <defs>
    <style>
      :root {
        --bg: #FFFDF9;
        --alt: #F2EDE0;
        --bd: #D5CDC0;
        --ink: #1A201C;
        --muted: #574F49;

        --gold-fill: #E59F38;
        --gold-tx: #9E5B08;
        --gold-bg: rgba(229, 159, 56, 0.14);

        --pizarra-fill: #405A6E;
        --pizarra-tx: #2F4658;
        --pizarra-bg: rgba(64, 90, 110, 0.12);

        --terra-fill: #B85335;
        --terra-tx: #9E3E22;
        --terra-bg: rgba(184, 83, 53, 0.12);

        --sage-fill: #637761;
        --sage-tx: #3D523B;
        --sage-bg: rgba(99, 119, 97, 0.14);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1F2421;
          --alt: #171C19;
          --bd: #313934;
          --ink: #F5EADB;
          --muted: #B5AA99;

          --gold-fill: #E59F38;
          --gold-tx: #F8AD00;
          --gold-bg: rgba(229, 159, 56, 0.18);

          --pizarra-fill: #6D93B0;
          --pizarra-tx: #8EB2CE;
          --pizarra-bg: rgba(64, 90, 110, 0.22);

          --terra-fill: #D46C4E;
          --terra-tx: #E68A6E;
          --terra-bg: rgba(184, 83, 53, 0.18);

          --sage-fill: #7C9D79;
          --sage-tx: #9EC09B;
          --sage-bg: rgba(99, 119, 97, 0.18);
        }
      }

      .card    { fill: var(--bg); stroke: var(--bd); stroke-width: 1.3; }
      .stamp   { fill: var(--alt); stroke: var(--bd); stroke-width: 1; }
      .pill    { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px; text-anchor: middle; }
      .title   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 800; fill: var(--ink); }
      .sub     { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 500; fill: var(--muted); }
      .tag-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: var(--ink); }

      @keyframes slowSpin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes livePulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.45; transform: scale(1.18); }
      }

      .orbit-glyph {
        transform-box: fill-box;
        transform-origin: center;
        animation: slowSpin 18s linear infinite;
      }
      .pulse-glyph {
        transform-box: fill-box;
        transform-origin: center;
        animation: livePulse 2.4s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .orbit-glyph, .pulse-glyph { animation: none; }
      }
    </style>

    <clipPath id="tClip1"><rect x="0" y="0" width="272" height="198" rx="8"/></clipPath>
    <clipPath id="tClip2"><rect x="0" y="0" width="272" height="198" rx="8"/></clipPath>
    <clipPath id="tClip3"><rect x="0" y="0" width="272" height="198" rx="8"/></clipPath>
    <clipPath id="tClip4"><rect x="0" y="0" width="272" height="198" rx="8"/></clipPath>
  </defs>

  <!-- BLOQUE 1: FRONTEND -->
  <g transform="translate(18, 17)">
    <rect class="card" x="0" y="0" width="272" height="198" rx="8"/>
    <g clip-path="url(#tClip1)">
      <rect x="0" y="0" width="272" height="4" fill="var(--gold-fill)"/>
    </g>

    <g transform="translate(18, 18)">
      <rect width="34" height="34" rx="5" fill="var(--gold-bg)" stroke="var(--gold-fill)" stroke-width="1"/>
      <circle class="orbit-glyph" cx="17" cy="17" r="10" fill="none" stroke="var(--gold-tx)" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="17" y="20.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5px" font-weight="800" fill="var(--gold-tx)">B</text>
    </g>

    <rect x="62" y="24" width="150" height="20" rx="3" fill="var(--gold-bg)"/>
    <text class="pill" x="137" y="37.5" fill="var(--gold-tx)">FRONTEND &#183; SPA</text>

    <text class="title" x="18" y="80">Blazor WASM</text>
    <text class="sub" x="18" y="101">WebAssembly 10.0 &#183; Taller UI</text>

    <rect class="stamp" x="18" y="118" width="236" height="27" rx="4"/>
    <circle cx="32" cy="131.5" r="3" fill="var(--gold-fill)"/>
    <text class="tag-lbl" x="44" y="135.5">Men&#250; Orbital &amp; Ticket Artesanal</text>

    <rect class="stamp" x="18" y="153" width="236" height="27" rx="4"/>
    <circle cx="32" cy="166.5" r="3" fill="var(--gold-fill)"/>
    <text class="tag-lbl" x="44" y="170.5">KDS Cocina, KDD Bar &amp; Mesas</text>
  </g>

  <!-- BLOQUE 2: BACKEND -->
  <g transform="translate(314, 17)">
    <rect class="card" x="0" y="0" width="272" height="198" rx="8"/>
    <g clip-path="url(#tClip2)">
      <rect x="0" y="0" width="272" height="4" fill="var(--pizarra-fill)"/>
    </g>

    <g transform="translate(18, 18)">
      <rect width="34" height="34" rx="5" fill="var(--pizarra-bg)" stroke="var(--pizarra-fill)" stroke-width="1"/>
      <text x="17" y="20.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5px" font-weight="800" fill="var(--pizarra-tx)">.NET</text>
    </g>

    <rect x="62" y="24" width="150" height="20" rx="3" fill="var(--pizarra-bg)"/>
    <text class="pill" x="137" y="37.5" fill="var(--pizarra-tx)">BACKEND &#183; API</text>

    <text class="title" x="18" y="80">.NET 10 Web API</text>
    <text class="sub" x="18" y="101">ASP.NET Core &#183; SOLID &amp; DRY</text>

    <rect class="stamp" x="18" y="118" width="236" height="27" rx="4"/>
    <circle class="pulse-glyph" cx="32" cy="131.5" r="3.5" fill="var(--pizarra-fill)"/>
    <text class="tag-lbl" x="44" y="135.5">Identity JWT + 8 Roles RBAC</text>

    <rect class="stamp" x="18" y="153" width="236" height="27" rx="4"/>
    <circle cx="32" cy="166.5" r="3" fill="var(--pizarra-fill)"/>
    <text class="tag-lbl" x="44" y="170.5">SignalR WebSockets en Vivo</text>
  </g>

  <!-- BLOQUE 3: DATOS -->
  <g transform="translate(610, 17)">
    <rect class="card" x="0" y="0" width="272" height="198" rx="8"/>
    <g clip-path="url(#tClip3)">
      <rect x="0" y="0" width="272" height="4" fill="var(--terra-fill)"/>
    </g>

    <g transform="translate(18, 18)">
      <rect width="34" height="34" rx="5" fill="var(--terra-bg)" stroke="var(--terra-fill)" stroke-width="1"/>
      <ellipse cx="17" cy="11" rx="8" ry="3" fill="none" stroke="var(--terra-tx)" stroke-width="1.6"/>
      <path d="M9 11 V23 C9 25 12.6 26.5 17 26.5 C21.4 26.5 25 25 25 23 V11" fill="none" stroke="var(--terra-tx)" stroke-width="1.6"/>
      <path d="M9 17 C9 19 12.6 20.5 17 20.5 C21.4 20.5 25 19 25 17" fill="none" stroke="var(--terra-tx)" stroke-width="1.4"/>
    </g>

    <rect x="62" y="24" width="160" height="20" rx="3" fill="var(--terra-bg)"/>
    <text class="pill" x="142" y="37.5" fill="var(--terra-tx)">DATOS &#183; SQL SERVER</text>

    <text class="title" x="18" y="80">SQL Server + EF</text>
    <text class="sub" x="18" y="101">Modelo Relacional 23 Tablas</text>

    <rect class="stamp" x="18" y="118" width="236" height="27" rx="4"/>
    <circle cx="32" cy="131.5" r="3" fill="var(--terra-fill)"/>
    <text class="tag-lbl" x="44" y="135.5">EF Core 10 + Migrations + Seed</text>

    <rect class="stamp" x="18" y="153" width="236" height="27" rx="4"/>
    <circle cx="32" cy="166.5" r="3" fill="var(--terra-fill)"/>
    <text class="tag-lbl" x="44" y="170.5">Inventario, Caja &amp; Bit&#225;cora</text>
  </g>

  <!-- BLOQUE 4: GESTIÓN AGIL -->
  <g transform="translate(906, 17)">
    <rect class="card" x="0" y="0" width="276" height="198" rx="8"/>
    <g clip-path="url(#tClip4)">
      <rect x="0" y="0" width="276" height="4" fill="var(--sage-fill)"/>
    </g>

    <g transform="translate(18, 18)">
      <rect width="34" height="34" rx="5" fill="var(--sage-bg)" stroke="var(--sage-fill)" stroke-width="1"/>
      <path class="pulse-glyph" d="M17 8 L25 16 L17 24 L9 16 Z" fill="none" stroke="var(--sage-tx)" stroke-width="1.8"/>
      <circle cx="17" cy="16" r="2.5" fill="var(--sage-tx)"/>
    </g>

    <rect x="62" y="24" width="146" height="20" rx="3" fill="var(--sage-bg)"/>
    <text class="pill" x="135" y="37.5" fill="var(--sage-tx)">SCRUM &#183; AGILE</text>

    <text class="title" x="18" y="80">Jira &amp; GitFlow</text>
    <text class="sub" x="18" y="101">Marco ITID803 &#183; Sprints 1 Sem.</text>

    <rect class="stamp" x="18" y="118" width="240" height="27" rx="4"/>
    <circle cx="32" cy="131.5" r="3" fill="var(--sage-fill)"/>
    <text class="tag-lbl" x="44" y="135.5">32 Historias (HU-01 a HU-32)</text>

    <rect class="stamp" x="18" y="153" width="240" height="27" rx="4"/>
    <circle cx="32" cy="166.5" r="3" fill="var(--sage-fill)"/>
    <text class="tag-lbl" x="44" y="170.5">Figma Workspace &#183; Retrospectiva</text>
  </g>
</svg>
