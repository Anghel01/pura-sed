<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-labelledby="tagsTitle tagsDesc">
  <title id="tagsTitle">PuraSed Tech Canvas &#8212; Ecosistema Tecnol&#243;gico</title>
  <desc id="tagsDesc">Ecosistema t&#233;cnico integrado: Cliente Blazor WASM en .NET 10, Backend ASP.NET Core Web API, Base de datos SQL Server con EF Core, y gesti&#243;n Scrum en Jira Software.</desc>
  <defs>
    <style>
      :root {
        --canvas-bg: #FFFFFF;
        --card-bg: #FFFFFF;
        --card-border: #D8DEE4;
        --title-color: #1F3A4D;
        --sub-color: #57606A;
        --tag-bg: #F6F8FA;
        --tag-border: #D0D7DE;
        --tag-text: #24292F;
        --flow-line: #0969DA;
        --flow-wire: #D0D7DE;
        --pill-bg: #F0F4F8;
        --pill-text: #3D8FAE;
        --shadow-color: rgba(31, 58, 77, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --canvas-bg: #0D1117;
          --card-bg: #161B22;
          --card-border: #30363D;
          --title-color: #F0F6FC;
          --sub-color: #8B949E;
          --tag-bg: #21262D;
          --tag-border: #30363D;
          --tag-text: #C9D1D9;
          --flow-line: #58A6FF;
          --flow-wire: #30363D;
          --pill-bg: #1C2633;
          --pill-text: #58A6FF;
          --shadow-color: rgba(0, 0, 0, 0.45);
        }
      }

      .card { fill: var(--card-bg); stroke: var(--card-border); stroke-width: 1.2; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: var(--title-color); }
      .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; font-size: 13px; font-weight: 500; fill: var(--sub-color); }
      .pill-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 1.2px; fill: var(--pill-text); }
      .tag-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; font-size: 11px; font-weight: 600; fill: var(--tag-text); }
      .proto-lbl { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; font-weight: 700; fill: var(--sub-color); letter-spacing: 0.5px; }

      @keyframes flowData {
        from { stroke-dashoffset: 24; }
        to   { stroke-dashoffset: 0; }
      }

      .flow-active {
        stroke: var(--flow-line);
        stroke-width: 2.2;
        stroke-dasharray: 6 5;
        animation: flowData 1.4s linear infinite;
      }

      .flow-sync {
        stroke: var(--flow-line);
        stroke-width: 1.8;
        stroke-dasharray: 4 4;
        opacity: 0.75;
        animation: flowData 2.2s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .flow-active, .flow-sync { animation: none; }
      }
    </style>

    <filter id="cSh" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow flood-color="var(--shadow-color)" dx="0" dy="5" stdDeviation="6"/>
    </filter>
  </defs>

  <!-- L&#205;NEAS CONECTORAS ENTRE PILARES -->
  <!-- 1 -> 2: Cliente a Servidor -->
  <line x1="288" y1="120" x2="320" y2="120" stroke="var(--flow-wire)" stroke-width="2.2"/>
  <line class="flow-active" x1="288" y1="120" x2="320" y2="120"/>
  <polygon points="318,116 325,120 318,124" fill="var(--flow-line)"/>
  <text class="proto-lbl" x="304" y="108" text-anchor="middle">HTTPS</text>

  <!-- 2 -> 3: Servidor a Base de Datos -->
  <line x1="584" y1="120" x2="616" y2="120" stroke="var(--flow-wire)" stroke-width="2.2"/>
  <line class="flow-active" x1="584" y1="120" x2="616" y2="120"/>
  <polygon points="614,116 621,120 614,124" fill="var(--flow-line)"/>
  <text class="proto-lbl" x="600" y="108" text-anchor="middle">TDS</text>

  <!-- 3 -> 4: Base de Datos a Gesti&#243;n Agile -->
  <line x1="880" y1="120" x2="912" y2="120" stroke="var(--flow-wire)" stroke-width="1.8"/>
  <line class="flow-sync" x1="880" y1="120" x2="912" y2="120"/>
  <circle cx="896" cy="120" r="3.2" fill="var(--flow-line)"/>
  <text class="proto-lbl" x="896" y="108" text-anchor="middle">SYNC</text>

  <!-- BLOQUE 1: CLIENTE (Blazor WASM) -->
  <g transform="translate(24, 18)">
    <rect class="card" x="0" y="0" width="264" height="204" rx="14" filter="url(#cSh)"/>
    <rect x="0" y="0" width="264" height="5" rx="2.5" fill="#512BD4"/>

    <!-- Logo .NET / Blazor -->
    <g transform="translate(18, 16)">
      <circle cx="16" cy="16" r="16" fill="#512BD4"/>
      <!-- Icono .NET -->
      <path d="M7 19 L11 9 L15 19 M8.5 16 L13.5 16" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <circle cx="18" cy="19" r="1.5" fill="#FFFFFF"/>
      <path d="M21 9 L25 19 M25 9 L21 19" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <rect x="58" y="21" width="105" height="22" rx="11" fill="var(--pill-bg)"/>
    <text class="pill-lbl" x="110" y="35.5" text-anchor="middle">CLIENTE &#183; SPA</text>

    <text class="title" x="18" y="78">.NET 10.0</text>
    <text class="sub" x="18" y="101">Blazor WebAssembly</text>

    <!-- Chips -->
    <rect x="18" y="122" width="145" height="26" rx="13" fill="var(--tag-bg)" stroke="var(--tag-border)" stroke-width="1"/>
    <text class="tag-lbl" x="90" y="139" text-anchor="middle">C# Nativo (WASM)</text>

    <rect x="18" y="157" width="175" height="26" rx="13" fill="var(--tag-bg)" stroke="var(--tag-border)" stroke-width="1"/>
    <text class="tag-lbl" x="105" y="174" text-anchor="middle">Vistas por Rol (QR Mesa)</text>
  </g>

  <!-- BLOQUE 2: SERVIDOR (ASP.NET Core Web API) -->
  <g transform="translate(320, 18)">
    <rect class="card" x="0" y="0" width="264" height="204" rx="14" filter="url(#cSh)"/>
    <rect x="0" y="0" width="264" height="5" rx="2.5" fill="#0078D4"/>

    <!-- Logo ASP.NET Core API -->
    <g transform="translate(18, 16)">
      <circle cx="16" cy="16" r="16" fill="#0078D4"/>
      <!-- Servidor / Cloud vector -->
      <rect x="7" y="10" width="18" height="5" rx="1.5" fill="#FFFFFF"/>
      <rect x="7" y="17" width="18" height="5" rx="1.5" fill="#FFFFFF"/>
      <circle cx="10" cy="12.5" r="1" fill="#0078D4"/>
      <circle cx="10" cy="19.5" r="1" fill="#0078D4"/>
      <line x1="20" y1="12.5" x2="22" y2="12.5" stroke="#0078D4" stroke-width="1.2"/>
      <line x1="20" y1="19.5" x2="22" y2="19.5" stroke="#0078D4" stroke-width="1.2"/>
    </g>

    <rect x="58" y="21" width="112" height="22" rx="11" fill="var(--pill-bg)"/>
    <text class="pill-lbl" x="114" y="35.5" text-anchor="middle">SERVIDOR &#183; API</text>

    <text class="title" x="18" y="78">ASP.NET Core</text>
    <text class="sub" x="18" y="101">Web API &amp; SignalR</text>

    <rect x="18" y="122" width="155" height="26" rx="13" fill="var(--tag-bg)" stroke="var(--tag-border)" stroke-width="1"/>
    <text class="tag-lbl" x="95" y="139" text-anchor="middle">RESTful &amp; OpenAPI v1</text>

    <rect x="18" y="157" width="180" height="26" rx="13" fill="var(--tag-bg)" stroke="var(--tag-border)" stroke-width="1"/>
    <text class="tag-lbl" x="108" y="174" text-anchor="middle">Comandas en Tiempo Real</text>
  </g>

  <!-- BLOQUE 3: DATOS (SQL Server & EF Core) -->
  <g transform="translate(616, 18)">
    <rect class="card" x="0" y="0" width="264" height="204" rx="14" filter="url(#cSh)"/>
    <rect x="0" y="0" width="264" height="5" rx="2.5" fill="#E4524F"/>

    <!-- Logo SQL Server / DB -->
    <g transform="translate(18, 16)">
      <circle cx="16" cy="16" r="16" fill="#CC292B"/>
      <!-- Cilindro BD -->
      <ellipse cx="16" cy="11" rx="9" ry="3.5" fill="#FFFFFF"/>
      <path d="M7 11 V16 C7 18 11 20 16 20 C21 20 25 18 25 16 V11" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M7 16 V21 C7 23 11 25 16 25 C21 25 25 23 25 21 V16" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    </g>

    <rect x="58" y="21" width="142" height="22" rx="11" fill="var(--pill-bg)"/>
    <text class="pill-lbl" x="129" y="35.5" text-anchor="middle">DATOS &#183; PERSISTENCIA</text>

    <text class="title" x="18" y="78">SQL Server</text>
    <text class="sub" x="18" y="101">Entity Framework Core</text>

    <rect x="18" y="122" width="165" height="26" rx="13" fill="var(--tag-bg)" stroke="var(--tag-border)" stroke-width="1"/>
    <text class="tag-lbl" x="100" y="139" text-anchor="middle">Code-First Migrations</text>

    <rect x="18" y="157" width="165" height="26" rx="13" fill="var(--tag-bg)" stroke="var(--tag-border)" stroke-width="1"/>
    <text class="tag-lbl" x="100" y="174" text-anchor="middle">Inventario &amp; Facturaci&#243;n</text>
  </g>

  <!-- BLOQUE 4: GESTI&#211;N (Atlassian Jira) -->
  <g transform="translate(912, 18)">
    <rect class="card" x="0" y="0" width="264" height="204" rx="14" filter="url(#cSh)"/>
    <rect x="0" y="0" width="264" height="5" rx="2.5" fill="#0052CC"/>

    <!-- Logo Atlassian Jira -->
    <g transform="translate(18, 16)">
      <circle cx="16" cy="16" r="16" fill="#0052CC"/>
      <!-- Rombo Jira -->
      <path d="M16 6 L23 13 L16 20 L9 13 Z" fill="#2684FF"/>
      <path d="M16 11 L21 16 L16 21 L11 16 Z" fill="#FFFFFF"/>
      <path d="M16 16 L23 23 L16 30 L9 23 Z" fill="#0052CC" opacity="0.4"/>
    </g>

    <rect x="58" y="21" width="112" height="22" rx="11" fill="var(--pill-bg)"/>
    <text class="pill-lbl" x="114" y="35.5" text-anchor="middle">GESTI&#211;N &#183; AGILE</text>

    <text class="title" x="18" y="78">Jira Software</text>
    <text class="sub" x="18" y="101">Atlassian Scrum Board</text>

    <rect x="18" y="122" width="160" height="26" rx="13" fill="var(--tag-bg)" stroke="var(--tag-border)" stroke-width="1"/>
    <text class="tag-lbl" x="98" y="139" text-anchor="middle">32 Historias de Usuario</text>

    <rect x="18" y="157" width="145" height="26" rx="13" fill="var(--tag-bg)" stroke="var(--tag-border)" stroke-width="1"/>
    <text class="tag-lbl" x="90" y="174" text-anchor="middle">Sprints Semanales</text>
  </g>
</svg>