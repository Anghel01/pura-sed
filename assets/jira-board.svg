<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="100%" role="img" aria-labelledby="jiraTitle jiraDesc">
  <title id="jiraTitle">Tablero Scrum en Atlassian Jira Software</title>
  <desc id="jiraDesc">Acceso directo al tablero Scrum oficial de PuraSed en Atlassian Jira Cloud.</desc>
  <defs>
    <style>
      .j-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: #0F172A; }
      .j-desc  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 400; fill: #475569; }
      .j-tag   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #1E293B; }
      .j-btn-t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #FFFFFF; }
      
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 1; }
        50%      { transform: scale(1.3); opacity: 0.5; }
      }
      .j-beacon {
        transform-origin: center;
        animation: pulseDot 2s ease-in-out infinite;
      }
    </style>
    <filter id="jiraShadow" x="-2%" y="-6%" width="104%" height="120%">
      <feDropShadow flood-color="#0052CC" flood-opacity="0.10" dx="0" dy="3" stdDeviation="5"/>
    </filter>
    <filter id="btnShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow flood-color="#0052CC" flood-opacity="0.25" dx="0" dy="2" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Tarjeta contenedor blanca -->
  <rect x="10" y="8" width="940" height="134" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#jiraShadow)"/>
  <rect x="10" y="8" width="6" height="134" fill="#0052CC" rx="3"/>

  <!-- Logo Jira Oficial Vectorial -->
  <g transform="translate(34, 32)">
    <circle cx="42" cy="42" r="36" fill="#0052CC"/>
    <path d="M42 17 L57 32 L42 47 L27 32 Z" fill="#2684FF"/>
    <path d="M42 28 L53 39 L42 50 L31 39 Z" fill="#FFFFFF"/>
    <path d="M42 39 L57 54 L42 69 L27 54 Z" fill="#0052CC" opacity="0.35"/>
  </g>

  <!-- Bloque Central de Información (Con margen seguro para evitar colisión) -->
  <g transform="translate(130, 24)">
    <text class="j-title" x="0" y="24">Tablero Scrum del Proyecto &#183; Atlassian Jira Software</text>
    <text class="j-desc" x="0" y="47">Seguimiento de historias de usuario, sprints y flujo del ciclo de vida.</text>

    <!-- Chips informativos alineados -->
    <g transform="translate(0, 64)">
      <rect x="0" y="0" width="125" height="24" rx="12" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1"/>
      <circle cx="12" cy="12" r="3.5" fill="#0284C7" class="j-beacon"/>
      <text class="j-tag" x="22" y="16" fill="#0369A1">Jira Cloud Live</text>

      <rect x="135" y="0" width="135" height="24" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
      <circle cx="147" cy="12" r="3.5" fill="#16A34A"/>
      <text class="j-tag" x="157" y="16" fill="#15803D">Scrum Framework</text>

      <rect x="280" y="0" width="190" height="24" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
      <text class="j-tag" x="375" y="16" text-anchor="middle" fill="#475569">Backlog &#8594; Sprints &#8594; Done</text>
    </g>
  </g>

  <!-- Botón de Enlace al Tablero en Vivo (Ubicado a la derecha sin solapamientos) -->
  <g transform="translate(735, 52)">
    <rect width="195" height="44" rx="8" fill="#0052CC" filter="url(#btnShadow)"/>
    <text class="j-btn-t" x="97" y="27" text-anchor="middle">Abrir Tablero en Jira &#8594;</text>
  </g>
</svg>