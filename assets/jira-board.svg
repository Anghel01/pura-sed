<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 156" width="100%" height="100%" role="img" aria-labelledby="jiraTitle jiraDesc">
  <title id="jiraTitle">Tablero Scrum en Atlassian Jira Software</title>
  <desc id="jiraDesc">Acceso directo al tablero Scrum oficial de PuraSed en Atlassian Jira Cloud: 32 Historias de Usuario y Sprints semanales.</desc>
  <defs>
    <style>
      :root {
        --bg: #FFFDF9;
        --bd: #D5CDC0;
        --ink: #1A201C;
        --muted: #574F49;
        --badge-bg: #171C19;
        --badge-bd: #405A6E;
        --accent: #405A6E;

        --p1-bg: rgba(64, 90, 110, 0.13);
        --p1-bd: rgba(64, 90, 110, 0.40);
        --p1-tx: #2F4658;

        --p2-bg: rgba(99, 119, 97, 0.15);
        --p2-bd: rgba(80, 105, 78, 0.42);
        --p2-tx: #3D523B;

        --p3-bg: #F2EDE0;
        --p3-bd: #D5CDC0;
        --p3-tx: #1A201C;

        --cta-bg: #E59F38;
        --cta-bd: #B57214;
        --cta-tx: #141816;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1F2421;
          --bd: #313934;
          --ink: #F5EADB;
          --muted: #B5AA99;
          --badge-bg: #121614;
          --badge-bd: #6D93B0;
          --accent: #6D93B0;

          --p1-bg: rgba(64, 90, 110, 0.24);
          --p1-bd: rgba(109, 147, 176, 0.45);
          --p1-tx: #8EB2CE;

          --p2-bg: rgba(99, 119, 97, 0.20);
          --p2-bd: rgba(124, 157, 121, 0.45);
          --p2-tx: #9EC09B;

          --p3-bg: #171C19;
          --p3-bd: #313934;
          --p3-tx: #F5EADB;

          --cta-bg: #E59F38;
          --cta-bd: #F8AD00;
          --cta-tx: #121614;
        }
      }

      .j-card  { fill: var(--bg); stroke: var(--bd); stroke-width: 1.4; }
      .j-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 800; fill: var(--ink); }
      .j-desc  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 400; fill: var(--muted); }
      .j-tag   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; }
      .j-btn-t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 800; fill: var(--cta-tx); letter-spacing: 0.3px; }

      @keyframes radarPulse {
        0%   { transform: scale(1); opacity: 0.8; }
        70%  { transform: scale(2.2); opacity: 0; }
        100% { transform: scale(2.2); opacity: 0; }
      }
      @keyframes jiraOrbit {
        from { transform: rotate(0deg); }
        to   { transform: rotate(-360deg); }
      }
      @keyframes jiraFloat {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-2px); }
      }
      @keyframes shimmerSweep {
        0%   { transform: translateX(-80px) skewX(-22deg); opacity: 0; }
        18%  { opacity: 0.24; }
        42%  { transform: translateX(250px) skewX(-22deg); opacity: 0; }
        100% { transform: translateX(250px) skewX(-22deg); opacity: 0; }
      }

      .j-beacon  { transform-box: fill-box; transform-origin: center; animation: radarPulse 2.3s ease-out infinite; }
      .j-orbit   { transform-box: fill-box; transform-origin: center; animation: jiraOrbit 30s linear infinite; }
      .j-float   { animation: jiraFloat 3.8s ease-in-out infinite; }
      .j-shimmer { opacity: 0; transform: translateX(-80px) skewX(-22deg); animation: shimmerSweep 5.2s ease-in-out infinite 1s; }

      @media (prefers-reduced-motion: reduce) {
        .j-beacon, .j-orbit, .j-float, .j-shimmer { animation: none; }
      }
    </style>

    <clipPath id="jiraCardClip"><rect x="6" y="8" width="948" height="140" rx="8"/></clipPath>
    <clipPath id="jiraBtnClip"><rect x="0" y="0" width="204" height="44" rx="5"/></clipPath>
  </defs>

  <rect class="j-card" x="6" y="8" width="948" height="140" rx="8"/>
  <g clip-path="url(#jiraCardClip)">
    <rect x="6" y="8" width="6" height="140" fill="var(--accent)"/>
  </g>

  <!-- Emblema Jira sobre medalla basalto con anillo Pizarra -->
  <g>
    <circle class="j-orbit" cx="74" cy="78" r="44" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.75"/>
    <circle cx="74" cy="78" r="35" fill="var(--badge-bg)" stroke="var(--badge-bd)" stroke-width="1.4"/>
    <g class="j-float">
      <path d="M74 52 L89 67 L74 82 L59 67 Z" fill="#6D93B0"/>
      <path d="M74 63 L85 74 L74 85 L63 74 Z" fill="#F5EADB"/>
      <path d="M74 74 L89 89 L74 104 L59 89 Z" fill="#E59F38" opacity="0.85"/>
    </g>
  </g>

  <!-- Bloque Central -->
  <g transform="translate(138, 30)">
    <text class="j-title" x="0" y="20">Tablero Scrum del Proyecto &#183; Atlassian Jira Software</text>
    <text class="j-desc" x="0" y="44">Gesti&#243;n semanal ITID803: 32 Historias de Usuario (HU-01 a HU-32), Sprints y Retrospectivas.</text>

    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="132" height="26" rx="4" fill="var(--p1-bg)" stroke="var(--p1-bd)" stroke-width="1"/>
      <circle class="j-beacon" cx="15" cy="13" r="4" fill="var(--accent)"/>
      <circle cx="15" cy="13" r="3" fill="var(--accent)"/>
      <text class="j-tag" x="26" y="17" fill="var(--p1-tx)">Jira Cloud Live</text>

      <rect x="142" y="0" width="150" height="26" rx="4" fill="var(--p2-bg)" stroke="var(--p2-bd)" stroke-width="1"/>
      <circle cx="156" cy="13" r="3.2" fill="var(--p2-tx)"/>
      <text class="j-tag" x="167" y="17" fill="var(--p2-tx)">Sprint 3 &#183; Scrum</text>

      <rect x="302" y="0" width="214" height="26" rx="4" fill="var(--p3-bg)" stroke="var(--p3-bd)" stroke-width="1"/>
      <text class="j-tag" x="409" y="17" text-anchor="middle" fill="var(--p3-tx)">Backlog &#8594; Sprints &#8594; Done</text>
    </g>
  </g>

  <!-- CTA -->
  <g transform="translate(728, 56)">
    <g clip-path="url(#jiraBtnClip)">
      <rect width="204" height="44" rx="5" fill="var(--cta-bg)" stroke="var(--cta-bd)" stroke-width="1.3"/>
      <rect class="j-shimmer" x="0" y="-10" width="44" height="64" fill="#FFFDF9"/>
    </g>
    <text class="j-btn-t" x="102" y="26.5" text-anchor="middle">ABRIR TABLERO JIRA &#8594;</text>
  </g>
</svg>
