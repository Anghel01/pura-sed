<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 590" width="100%" height="100%" role="img" aria-labelledby="strTitle strDesc">
  <title id="strTitle">Estructura del Proyecto PuraSed</title>
  <desc id="strDesc">&#193;rbol estructurado de la soluci&#243;n con iconos vectoriales y comentarios alineados.</desc>
  <defs>
    <style>
      .t-dir   { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #0F172A; }
      .t-file  { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #1E293B; }
      .t-desc  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: #64748B; }
      .t-tag   { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; }
      .tree-guide { stroke: #CBD5E1; stroke-width: 1.2; stroke-dasharray: 2 2; }
    </style>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="106%">
