  <!-- Barra superior estilo IDE -->
  <path d="M 0 14 C 0 6 6 0 14 0 L 926 0 C 934 0 940 6 940 14 L 940 38 L 0 38 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="22" cy="19" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="38" cy="19" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="54" cy="19" r="5" fill="#10B981" opacity="0.8"/>
  <text x="76" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5px" font-weight="600" fill="#64748B">Explorador de la Soluci&#243;n .NET 10 &#183; pura-sed</text>

  <!-- ============================================== -->
  <!-- RAÍZ: pura-sed/ (y: 62) -->
  <!-- ============================================== -->
  <g transform="translate(30, 62)">
