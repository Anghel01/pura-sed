    <text x="8" y="15" text-anchor="middle" font-size="9px" font-weight="bold" fill="#7C3AED">&#9670;</text>
    <text x="26" y="15" class="t-file">PuraSed.slnx</text>
    <text x="415" y="15" class="t-desc"># Soluci&#243;n moderna .NET 10 (WebApi + Blazor WASM)</text>
