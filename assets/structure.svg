<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 658" width="100%" height="100%" role="img" aria-labelledby="strTitle strDesc">
  <title id="strTitle">Estructura del Proyecto PuraSed</title>
  <desc id="strDesc">&#193;rbol estructurado de la soluci&#243;n .NET 10 con arquitectura SOLID, Figma UI/UX y comentarios alineados.</desc>
  <defs>
    <style>
      :root {
        --ide-bg: #FFFFFF;
        --ide-bd: #D8DEE4;
        --bar-bg: #F8FAFC;
        --dir-clr: #0F172A;
        --file-clr: #1E293B;
        --desc-clr: #64748B;
        --guide-clr: #CBD5E1;
        --pill-bg: #ECFDF5;
        --pill-bd: #A7F3D0;
        --pill-tx: #047857;
        --sh-clr: rgba(15, 23, 42, 0.06);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ide-bg: #161B22;
          --ide-bd: #30363D;
          --bar-bg: #0D1117;
          --dir-clr: #F0F6FC;
          --file-clr: #E6EDF3;
          --desc-clr: #8B949E;
          --guide-clr: #30363D;
          --pill-bg: rgba(16, 185, 129, 0.14);
          --pill-bd: rgba(52, 211, 153, 0.35);
          --pill-tx: #6EE7B7;
          --sh-clr: rgba(0, 0, 0, 0.45);
        }
      }

      .ide-win    { fill: var(--ide-bg); stroke: var(--ide-bd); stroke-width: 1.4; }
      .t-dir      { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 700; fill: var(--dir-clr); }
      .t-file     { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: var(--file-clr); }
      .t-desc     { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: var(--desc-clr); }
      .tree-guide { stroke: var(--guide-clr); stroke-width: 1.2; stroke-dasharray: 2.5 2.5; }

      @keyframes buildPulse {
        0%   { transform: scale(1); opacity: 0.85; }
        70%  { transform: scale(2.2); opacity: 0; }
        100% { transform: scale(2.2); opacity: 0; }
      }
      .build-dot {
        transform-box: fill-box;
        transform-origin: center;
        animation: buildPulse 2.4s ease-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .build-dot { animation: none; }
      }
    </style>

    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="var(--sh-clr)"/>
    </filter>
    <clipPath id="ideClip">
      <rect width="980" height="658" rx="14"/>
    </clipPath>
  </defs>

  <!-- Ventana IDE adaptativa -->
  <rect class="ide-win" width="980" height="658" rx="14" filter="url(#card-shadow)"/>

  <!-- Barra superior estilo IDE -->
  <g clip-path="url(#ideClip)">
    <rect x="0" y="0" width="980" height="40" fill="var(--bar-bg)"/>
    <line x1="0" y1="40" x2="980" y2="40" stroke="var(--ide-bd)" stroke-width="1"/>
  </g>
  <circle cx="22" cy="20" r="5" fill="#EF4444" opacity="0.85"/>
  <circle cx="38" cy="20" r="5" fill="#F59E0B" opacity="0.85"/>
  <circle cx="54" cy="20" r="5" fill="#10B981" opacity="0.85"/>
  <text x="76" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12px" font-weight="600" fill="var(--desc-clr)">Explorador de la Soluci&#243;n .NET 10 &#183; pura-sed</text>

  <!-- Pill derecho: Estado de compilación -->
  <rect x="772" y="9" width="190" height="22" rx="11" fill="var(--pill-bg)" stroke="var(--pill-bd)" stroke-width="1"/>
  <circle class="build-dot" cx="786" cy="20" r="4" fill="#10B981"/>
  <circle cx="786" cy="20" r="3" fill="#10B981"/>
  <text x="797" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5px" font-weight="600" fill="var(--pill-tx)">Build Verified &#183; 0 Warnings</text>

  <!-- ============================================== -->
  <!-- RAÍZ: pura-sed/ (y: 62) -->
  <!-- ============================================== -->
  <g transform="translate(30, 62)">
    <path d="M 0 3 L 8 3 L 12 7 L 22 7 C 23.5 7 24 7.5 24 9 L 24 19 C 24 20.5 23.5 21 22 21 L 2 21 C 0.5 21 0 20.5 0 19 Z" fill="#F59E0B"/>
    <text x="32" y="16" class="t-dir">pura-sed/</text>
  </g>

  <!-- Línea guía raíz -->
  <line x1="42" y1="85" x2="42" y2="564" class="tree-guide"/>

  <!-- Archivos raíz -->
  <g transform="translate(56, 90)">
