    <rect x="0" y="2" width="16" height="18" rx="2" fill="var(--pizarra-bg)" stroke="var(--pizarra-st)" stroke-width="1.2"/>
    <text x="8" y="15" text-anchor="middle" font-size="9px" font-weight="bold" fill="var(--pizarra-tx)">&#9670;</text>
    <text x="26" y="15" class="t-file">PuraSed.slnx</text>
    <text x="415" y="15" class="t-desc"># Soluci&#243;n moderna .NET 10 (WebApi + Blazor WASM)</text>
  </g>

  <g transform="translate(56, 114)">
    <line x1="-14" y1="10" x2="0" y2="10" class="tree-guide"/>
    <rect x="0" y="2" width="16" height="18" rx="2" fill="var(--gold-bg)" stroke="var(--gold-st)" stroke-width="1.2"/>
    <text x="8" y="15" text-anchor="middle" font-size="8px" font-weight="bold" fill="var(--gold-tx)">&#10003;</text>
    <text x="26" y="15" class="t-file">README.md</text>
    <text x="415" y="15" class="t-desc"># Documentaci&#243;n t&#233;cnica y visual del sistema</text>
  </g>

  <g transform="translate(56, 138)">
    <line x1="-14" y1="10" x2="0" y2="10" class="tree-guide"/>
    <rect x="0" y="2" width="16" height="18" rx="2" fill="var(--bar)" stroke="var(--bd)" stroke-width="1.2"/>
    <text x="8" y="15" text-anchor="middle" font-size="8px" font-weight="bold" fill="var(--desc)">~</text>
    <text x="26" y="15" class="t-file">.gitignore</text>
    <text x="415" y="15" class="t-desc"># Exclusiones binarias obligatorias (bin/, obj/)</text>
  </g>

  <!-- CARPETA assets/ -->
  <g transform="translate(56, 166)">
    <line x1="-14" y1="10" x2="0" y2="10" class="tree-guide"/>
    <path d="M 0 2 L 6 2 L 9 5 L 18 5 C 19 5 19.5 5.5 19.5 6.5 L 19.5 15 C 19.5 16 19 16.5 18 16.5 L 1.5 16.5 C 0.5 16.5 0 16 0 15 Z" fill="var(--gold-st)"/>
    <text x="26" y="15" class="t-dir" style="fill: var(--gold-tx);">assets/</text>
    <text x="415" y="15" class="t-desc"># Recursos SVG adaptativos (Dark/Light) e identidad gr&#225;fica</text>
  </g>

  <line x1="72" y1="186" x2="72" y2="286" class="tree-guide"/>

  <g transform="translate(86, 190)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <circle cx="6" cy="8" r="4" fill="var(--gold-st)"/>
    <text x="18" y="12" class="t-file">banner.svg, tags.svg, jira-board.svg</text>
    <text x="385" y="12" class="t-desc"># Hero animado, stack tecnol&#243;gico y portal Scrum</text>
  </g>

  <g transform="translate(86, 212)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <circle cx="6" cy="8" r="4" fill="var(--terra-st)"/>
    <text x="18" y="12" class="t-file">figma-board.svg, figma-modules.svg</text>
    <text x="385" y="12" class="t-desc"># Portal Figma y 3 subsistemas Front/Back-Office</text>
  </g>

  <g transform="translate(86, 234)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <circle cx="6" cy="8" r="4" fill="var(--sage-st)"/>
    <text x="18" y="12" class="t-file">architecture.svg, casos-de-uso.svg, ER</text>
    <text x="385" y="12" class="t-desc"># Diagramas animados arquitectura, UML y ER (23 tablas)</text>
  </g>

  <g transform="translate(86, 256)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <circle cx="6" cy="8" r="4" fill="var(--pizarra-st)"/>
    <text x="18" y="12" class="t-file">security-rbac.svg, git-flow.svg</text>
    <text x="385" y="12" class="t-desc"># Pipeline JWT/RBAC y flujo GitFlow animado</text>
  </g>

  <g transform="translate(86, 278)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <path d="M 0 1 L 5 1 L 7 3 L 14 3 C 15 3 15 3.5 15 4.5 L 15 12 C 15 13 15 13 14 13 L 1 13 C 0 13 0 13 0 12 Z" fill="var(--gold-st)"/>
    <text x="20" y="12" class="t-file">team/, icons/, _src/</text>
    <text x="385" y="12" class="t-desc"># Tarjetas orbitales del equipo, 15 &#237;conos y scripts</text>
  </g>

  <!-- CARPETA Entregables/ -->
  <g transform="translate(56, 308)">
    <line x1="-14" y1="10" x2="0" y2="10" class="tree-guide"/>
    <path d="M 0 2 L 6 2 L 9 5 L 18 5 C 19 5 19.5 5.5 19.5 6.5 L 19.5 15 C 19.5 16 19 16.5 18 16.5 L 1.5 16.5 C 0.5 16.5 0 16 0 15 Z" fill="var(--terra-st)"/>
    <text x="26" y="15" class="t-dir" style="fill: var(--terra-tx);">Entregables/</text>
    <text x="415" y="15" class="t-desc"># Especificaciones EPN, UML, diccionario BD y gu&#237;as</text>
  </g>

  <line x1="72" y1="328" x2="72" y2="362" class="tree-guide"/>

