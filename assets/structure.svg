<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 658" width="100%" height="100%" role="img" aria-labelledby="strTitle strDesc">
  <title id="strTitle">Estructura del Proyecto PuraSed</title>
  <desc id="strDesc">&#193;rbol estructurado de la soluci&#243;n .NET 10 con arquitectura SOLID, taller Figma UI/UX y documentos.</desc>
  <defs>
    <style>
      :root {
        --bg: #FFFFFF;
        --bd: #D2E3F0;
        --bar: #EFF7FC;
        --dir: #152336;
        --file: #1E3048;
        --desc: #4B6178;
        --guide: #CFE0EE;

        --gold-st: #D08414;
        --gold-tx: #854D03;
        --gold-bg: #FFF7E4;

        --terra-st: #DF5E55;
        --terra-tx: #A62B23;

        --sage-st: #2BA36D;
        --sage-tx: #136740;
        --sage-bg: #E8F9F1;

        --pizarra-st: #2E98BE;
        --pizarra-tx: #0C5F7D;
        --pizarra-bg: #E7F6FC;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #152033;
          --bd: #2B3D59;
          --bar: #1C2A42;
          --dir: #F1F6FC;
          --file: #DBE6F5;
          --desc: #9FB3CB;
          --guide: #466188;

          --gold-st: #F6C25E;
          --gold-tx: #FAD488;
          --gold-bg: #2C2315;

          --terra-st: #F28B82;
          --terra-tx: #F9AAA3;

          --sage-st: #6AD3A2;
          --sage-tx: #8EE2BA;
          --sage-bg: #122C26;

          --pizarra-st: #74C6DF;
          --pizarra-tx: #94D9EE;
          --pizarra-bg: #132A3C;
        }
      }

      .ide-win    { fill: var(--bg); stroke: var(--bd); stroke-width: 1.4; }
      .t-dir      { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; font-weight: 800; fill: var(--dir); }
      .t-file     { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: var(--file); }
      .t-desc     { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: var(--desc); }
      .tree-guide { stroke: var(--guide); stroke-width: 1.2; stroke-dasharray: 2.5 2.5; }

      @keyframes buildPulse { 0% { transform: scale(1); opacity: 0.85; } 70% { transform: scale(2.2); opacity: 0; } 100% { transform: scale(2.2); opacity: 0; } }
      .build-dot { transform-box: fill-box; transform-origin: center; animation: buildPulse 2.4s ease-out infinite; }
      @media (prefers-reduced-motion: reduce) { .build-dot { animation: none; } }
    </style>

    <clipPath id="ideClip"><rect width="980" height="658" rx="8"/></clipPath>
  </defs>

  <rect class="ide-win" width="980" height="658" rx="8"/>

  <g clip-path="url(#ideClip)">
    <rect x="0" y="0" width="980" height="40" fill="var(--bar)"/>
    <line x1="0" y1="40" x2="980" y2="40" stroke="var(--bd)" stroke-width="1"/>
  </g>
  <circle cx="22" cy="20" r="4.5" fill="var(--terra-st)"/>
  <circle cx="38" cy="20" r="4.5" fill="var(--gold-st)"/>
  <circle cx="54" cy="20" r="4.5" fill="var(--sage-st)"/>
  <text x="76" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12px" font-weight="700" fill="var(--desc)">Explorador de la Soluci&#243;n .NET 10 &#183; pura-sed</text>

  <rect x="766" y="9" width="196" height="22" rx="11" fill="var(--sage-bg)" stroke="var(--sage-st)" stroke-width="1"/>
  <circle class="build-dot" cx="781" cy="20" r="4" fill="var(--sage-st)"/>
  <circle cx="781" cy="20" r="3" fill="var(--sage-st)"/>
  <text x="793" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5px" font-weight="700" fill="var(--sage-tx)">Build Verified &#183; 0 Warnings</text>

  <!-- RAIZ -->
  <g transform="translate(30, 62)">
    <path d="M 0 3 L 8 3 L 12 7 L 22 7 C 23.5 7 24 7.5 24 9 L 24 19 C 24 20.5 23.5 21 22 21 L 2 21 C 0.5 21 0 20.5 0 19 Z" fill="var(--gold-st)"/>
    <text x="32" y="16" class="t-dir">pura-sed/</text>
  </g>

  <line x1="42" y1="85" x2="42" y2="564" class="tree-guide"/>

