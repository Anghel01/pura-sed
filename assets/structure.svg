  </g>

  <g transform="translate(86, 533)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <rect x="0" y="1" width="13" height="14" rx="2" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
