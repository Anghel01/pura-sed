    <rect x="0" y="2" width="16" height="18" rx="2" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.2"/>
    <text x="8" y="15" text-anchor="middle" font-size="8px" font-weight="bold" fill="#475569">~</text>
    <text x="26" y="15" class="t-file">.gitignore</text>
    <text x="415" y="15" class="t-desc"># Exclusiones de compilaci&#243;n binaria (bin/, obj/)</text>
  </g>

