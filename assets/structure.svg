    <circle cx="6" cy="8" r="4" fill="#06B6D4"/>
    <text x="18" y="12" class="t-file">banner.svg, tags.svg, jira-board.svg</text>
    <text x="385" y="12" class="t-desc"># Hero animado, lienzo tecnol&#243;gico y portal Scrum</text>
  </g>

  <g transform="translate(86, 212)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <circle cx="6" cy="8" r="4" fill="#A259FF"/>
    <text x="18" y="12" class="t-file">figma-board.svg, figma-modules.svg</text>
    <text x="385" y="12" class="t-desc"># Portales interactivos y m&#243;dulos UI/UX en Figma</text>
  </g>

  <g transform="translate(86, 234)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <circle cx="6" cy="8" r="4" fill="#10B981"/>
    <text x="18" y="12" class="t-file">architecture.svg, casos-de-uso.svg</text>
    <text x="385" y="12" class="t-desc"># Diagramas animados de arquitectura y casos UML</text>
  </g>

  <g transform="translate(86, 256)">
