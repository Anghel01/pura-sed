    <text x="8" y="15" text-anchor="middle" font-size="8px" font-weight="bold" fill="#0369A1">&#10003;</text>
    <text x="26" y="15" class="t-file">README.md</text>
    <text x="415" y="15" class="t-desc"># Documentaci&#243;n interactiva del sistema y gu&#237;as</text>
  </g>

  <g transform="translate(56, 138)">
