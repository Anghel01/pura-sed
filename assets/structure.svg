    <path d="M 0 2 L 6 2 L 9 5 L 18 5 C 19 5 19.5 5.5 19.5 6.5 L 19.5 15 C 19.5 16 19 16.5 18 16.5 L 1.5 16.5 C 0.5 16.5 0 16 0 15 Z" fill="#14B8A6"/>
    <text x="26" y="15" class="t-dir" fill="#14B8A6">retrospective/</text>
