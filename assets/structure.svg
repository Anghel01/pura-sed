    <path d="M 0 1 L 5 1 L 7 3 L 14 3 C 15 3 15 3.5 15 4.5 L 15 12 C 15 13 15 13 14 13 L 1 13 C 0 13 0 13 0 12 Z" fill="#F59E0B"/>
    <text x="20" y="12" class="t-file">Pages/</text>
    <text x="340" y="12" class="t-desc"># Vistas Razor reactivas (Comandas, Men&#250;, Despacho, Arqueo)</text>
  </g>

  <g transform="translate(86, 489)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <path d="M 0 1 L 5 1 L 7 3 L 14 3 C 15 3 15 3.5 15 4.5 L 15 12 C 15 13 15 13 14 13 L 1 13 C 0 13 0 13 0 12 Z" fill="#F59E0B"/>
    <text x="20" y="12" class="t-file">Properties/</text>
    <text x="340" y="12" class="t-desc"># launchSettings.json (Perfiles HTTP 5068 / HTTPS 7020)</text>
  </g>

  <g transform="translate(86, 511)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <path d="M 0 1 L 5 1 L 7 3 L 14 3 C 15 3 15 3.5 15 4.5 L 15 12 C 15 13 15 13 14 13 L 1 13 C 0 13 0 13 0 12 Z" fill="#F59E0B"/>
    <text x="20" y="12" class="t-file">wwwroot/</text>
