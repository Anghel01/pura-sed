    <path d="M 0 1 L 5 1 L 7 3 L 14 3 C 15 3 15 3.5 15 4.5 L 15 12 C 15 13 15 13 14 13 L 1 13 C 0 13 0 13 0 12 Z" fill="var(--pizarra-st)"/>
    <text x="20" y="12" class="t-file">Services/, Repositories/</text>
    <text x="385" y="12" class="t-desc"># Capa de negocio e interfaces desacopladas (SOLID)</text>
  </g>

  <g transform="translate(86, 502)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <path d="M 0 1 L 5 1 L 7 3 L 14 3 C 15 3 15 3.5 15 4.5 L 15 12 C 15 13 15 13 14 13 L 1 13 C 0 13 0 13 0 12 Z" fill="var(--pizarra-st)"/>
    <text x="20" y="12" class="t-file">Data/, Migrations/</text>
    <text x="385" y="12" class="t-desc"># PuraSedDbContext, Seeders y migraciones EF Core</text>
  </g>

  <g transform="translate(86, 524)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <rect x="0" y="1" width="13" height="14" rx="2" fill="var(--gold-bg)" stroke="var(--gold-st)" stroke-width="1"/>
    <text x="18" y="12" class="t-file">appsettings.json, Program.cs</text>
    <text x="385" y="12" class="t-desc"># Configuraci&#243;n JWT Bearer, DI, Identity y Swagger</text>
  </g>

  <!-- CARPETA PuraSed.Client/ -->
  <g transform="translate(56, 554)">
    <line x1="-14" y1="10" x2="0" y2="10" class="tree-guide"/>
    <path d="M 0 2 L 6 2 L 9 5 L 18 5 C 19 5 19.5 5.5 19.5 6.5 L 19.5 15 C 19.5 16 19 16.5 18 16.5 L 1.5 16.5 C 0.5 16.5 0 16 0 15 Z" fill="var(--sage-st)"/>
    <text x="26" y="15" class="t-dir" style="fill: var(--sage-tx);">PuraSed.Client/</text>
    <text x="415" y="15" class="t-desc"># Frontend: Blazor WebAssembly 10.0 (Cliente SPA)</text>
  </g>

  <line x1="72" y1="574" x2="72" y2="630" class="tree-guide"/>

  <g transform="translate(86, 578)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <path d="M 0 1 L 5 1 L 7 3 L 14 3 C 15 3 15 3.5 15 4.5 L 15 12 C 15 13 15 13 14 13 L 1 13 C 0 13 0 13 0 12 Z" fill="var(--sage-st)"/>
