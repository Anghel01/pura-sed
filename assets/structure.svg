    <path d="M 0 1 L 5 1 L 7 3 L 14 3 C 15 3 15 3.5 15 4.5 L 15 12 C 15 13 15 13 14 13 L 1 13 C 0 13 0 13 0 12 Z" fill="var(--terra-st)"/>
    <text x="20" y="12" class="t-file">SP1/, SP2/, Sprint2/</text>
    <text x="385" y="12" class="t-desc"># Alcance, 32 HUs, UML, ER y Acoplamiento_Roles.md</text>
  </g>

  <g transform="translate(86, 354)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <path d="M 0 1 L 5 1 L 7 3 L 14 3 C 15 3 15 3.5 15 4.5 L 15 12 C 15 13 15 13 14 13 L 1 13 C 0 13 0 13 0 12 Z" fill="var(--terra-st)"/>
    <text x="20" y="12" class="t-file">Mockups_Figma/</text>
    <text x="385" y="12" class="t-desc"># 14 prototipos HTML, 6 capturas @2x y gu&#237;a UI/UX</text>
  </g>

  <!-- CARPETA retrospective/ -->
  <g transform="translate(56, 382)">
    <line x1="-14" y1="10" x2="0" y2="10" class="tree-guide"/>
    <path d="M 0 2 L 6 2 L 9 5 L 18 5 C 19 5 19.5 5.5 19.5 6.5 L 19.5 15 C 19.5 16 19 16.5 18 16.5 L 1.5 16.5 C 0.5 16.5 0 16 0 15 Z" fill="var(--sage-st)"/>
    <text x="26" y="15" class="t-dir" style="fill: var(--sage-tx);">retrospective/</text>
    <text x="415" y="15" class="t-desc"># Actas de retrospectiva semanal (SP1, SP2 y SP3)</text>
  </g>

  <!-- CARPETA PuraSed.WebApi/ -->
  <g transform="translate(56, 412)">
    <line x1="-14" y1="10" x2="0" y2="10" class="tree-guide"/>
    <path d="M 0 2 L 6 2 L 9 5 L 18 5 C 19 5 19.5 5.5 19.5 6.5 L 19.5 15 C 19.5 16 19 16.5 18 16.5 L 1.5 16.5 C 0.5 16.5 0 16 0 15 Z" fill="var(--pizarra-st)"/>
    <text x="26" y="15" class="t-dir" style="fill: var(--pizarra-tx);">PuraSed.WebApi/</text>
    <text x="415" y="15" class="t-desc"># Backend: ASP.NET Core 10 (Identity + JWT + RBAC)</text>
  </g>

  <line x1="72" y1="432" x2="72" y2="532" class="tree-guide"/>

  <g transform="translate(86, 436)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <path d="M 0 1 L 5 1 L 7 3 L 14 3 C 15 3 15 3.5 15 4.5 L 15 12 C 15 13 15 13 14 13 L 1 13 C 0 13 0 13 0 12 Z" fill="var(--pizarra-st)"/>
    <text x="20" y="12" class="t-file">Constants/, DTOs/, Models/</text>
    <text x="385" y="12" class="t-desc"># Roles.cs (8 roles DRY), ApplicationUser y entidades</text>
  </g>

  <g transform="translate(86, 458)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <path d="M 0 1 L 5 1 L 7 3 L 14 3 C 15 3 15 3.5 15 4.5 L 15 12 C 15 13 15 13 14 13 L 1 13 C 0 13 0 13 0 12 Z" fill="var(--pizarra-st)"/>
    <text x="20" y="12" class="t-file">Controllers/</text>
    <text x="385" y="12" class="t-desc"># Auth, Mesas, Pagos, Pedidos, Productos, Reportes, Usuarios</text>
  </g>

  <g transform="translate(86, 480)">
