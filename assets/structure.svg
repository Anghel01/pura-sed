  <g transform="translate(86, 622)">
    <line x1="-14" y1="8" x2="0" y2="8" class="tree-guide"/>
    <rect x="0" y="1" width="13" height="14" rx="2" fill="var(--gold-bg)" stroke="var(--gold-st)" stroke-width="1"/>
    <text x="18" y="12" class="t-file">Program.cs</text>
    <text x="385" y="12" class="t-desc"># Inicializador WebAssembly, HttpClient y servicios</text>
  </g>
</svg>
