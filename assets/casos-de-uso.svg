<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%" role="img" aria-labelledby="ucTitle ucDesc">
  <title id="ucTitle">Diagrama de Casos de Uso Animado &#8212; Sistema PuraSed</title>
  <desc id="ucDesc">Diagrama UML formal con fondo blanco puro, bordes animados y conexiones fluidas entre actores y casos de uso.</desc>
  <defs>
    <style>
      .t-bound { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #475569; }
      .a-name  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0F172A; text-anchor: middle; }
      .a-sub   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; font-weight: 500; fill: #64748B; text-anchor: middle; }
      .uc-txt  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0F172A; text-anchor: middle; }

      /* Animaci&#243;n de bordes de la cuadr&#237;cula del sistema */
      @keyframes borderMarch {
        from { stroke-dashoffset: 0; }
        to   { stroke-dashoffset: -32; }
      }

      .animated-boundary {
        stroke: #0284C7;
        stroke-width: 1.8;
        stroke-dasharray: 8 6;
        animation: borderMarch 4s linear infinite;
      }

      /* Animaci&#243;n de pulsos en las l&#237;neas de asociaci&#243;n */
      @keyframes flowPulse {
        from { stroke-dashoffset: 24; }
        to   { stroke-dashoffset: 0; }
      }

      .flow-line-blue {
        stroke: #0284C7;
        stroke-width: 1.8;
        stroke-dasharray: 6 5;
        animation: flowPulse 1.2s linear infinite;
      }

      .flow-line-amber {
        stroke: #D97706;
        stroke-width: 1.8;
        stroke-dasharray: 6 5;
        animation: flowPulse 1.2s linear infinite;
      }

      .flow-line-purple {
        stroke: #7C3AED;
        stroke-width: 1.8;
        stroke-dasharray: 6 5;
        animation: flowPulse 1.2s linear infinite;
      }

      .flow-line-green {
        stroke: #059669;
        stroke-width: 1.8;
        stroke-dasharray: 6 5;
        animation: flowPulse 1.2s linear infinite;
      }

      .flow-line-indigo {
        stroke: #4F46E5;
        stroke-width: 1.8;
        stroke-dasharray: 6 5;
        animation: flowPulse 1.2s linear infinite;
      }

      /* Halo pulsante del actor */
      @keyframes actorPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50%      { transform: scale(1.15); opacity: 0.2; }
      }

      .actor-halo {
        transform-origin: center;
        animation: actorPulse 2.5s ease-in-out infinite;
      }
    </style>

    <!-- Marcadores de flechas UML -->
    <marker id="dot-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="4" fill="#0284C7"/>
    </marker>
    <marker id="dot-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="4" fill="#D97706"/>
    </marker>
    <marker id="dot-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="4" fill="#7C3AED"/>
    </marker>
    <marker id="dot-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="4" fill="#059669"/>
    </marker>
    <marker id="dot-indigo" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="4" fill="#4F46E5"/>
    </marker>

    <!-- Sombra suave para tarjetas -->
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Fondo blanco puro del lienzo -->
  <rect width="960" height="550" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#soft-shadow)"/>

  <!-- L&#237;mite del Sistema (System Boundary) con borde animado -->
  <g transform="translate(190, 20)">
    <rect width="580" height="510" rx="14" fill="#F8FAFC" />
    <rect width="580" height="510" rx="14" fill="none" class="animated-boundary" />
    <text x="25" y="30" class="t-bound">L&#205;MITE DEL SISTEMA: PURASED CORE (BLAZOR &amp; WEB API)</text>
  </g>

  <!-- ========================================== -->
  <!-- L&#205;NEAS DE ASOCIACI&#211;N ANIMADAS ACTORES -> CASOS -->
  <!-- ========================================== -->
  <!-- Desde Cliente (x: 170, y: 110) -->
  <path d="M 170 110 L 260 90" class="flow-line-blue" marker-end="url(#dot-blue)"/>
  <path d="M 170 110 L 260 155" class="flow-line-blue" marker-end="url(#dot-blue)"/>
  <path d="M 170 110 L 260 220" class="flow-line-blue" marker-end="url(#dot-blue)"/>

  <!-- Desde Mesero (x: 170, y: 390) -->
  <path d="M 170 390 L 260 285" class="flow-line-amber" marker-end="url(#dot-amber)"/>
  <path d="M 170 390 L 260 350" class="flow-line-amber" marker-end="url(#dot-amber)"/>
  <path d="M 170 390 L 260 415" class="flow-line-amber" marker-end="url(#dot-amber)"/>

  <!-- Desde Cocina y Bar (x: 790, y: 100) -->
  <path d="M 790 100 L 700 90" class="flow-line-purple" marker-end="url(#dot-purple)"/>
  <path d="M 790 100 L 700 155" class="flow-line-purple" marker-end="url(#dot-purple)"/>

  <!-- Desde Asistente (x: 790, y: 260) -->
  <path d="M 790 260 L 700 220" class="flow-line-green" marker-end="url(#dot-green)"/>
  <path d="M 790 260 L 700 285" class="flow-line-green" marker-end="url(#dot-green)"/>

  <!-- Desde Administrador (x: 790, y: 420) -->
  <path d="M 790 420 L 700 350" class="flow-line-indigo" marker-end="url(#dot-indigo)"/>
  <path d="M 790 420 L 700 415" class="flow-line-indigo" marker-end="url(#dot-indigo)"/>
  <path d="M 790 420 L 580 475" class="flow-line-indigo" marker-end="url(#dot-indigo)"/>

  <!-- ========================================== -->
  <!-- CASOS DE USO (&#211;VALOS UML) DENTRO DEL L&#205;MITE -->
  <!-- ========================================== -->
  <!-- Columna Izquierda (x: 230 a 460) -->
  <!-- CU-01: Escaneo QR y Catálogo -->
  <g transform="translate(230, 70)">
    <rect width="230" height="42" rx="21" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="115" y="26" class="uc-txt">CU-01: Escanear QR y Men&#250;</text>
  </g>

  <!-- CU-02: Generar Comanda -->
  <g transform="translate(230, 135)">
    <rect width="230" height="42" rx="21" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="115" y="26" class="uc-txt">CU-02: Realizar Pedido por Mesa</text>
  </g>

  <!-- CU-03: Seguimiento SignalR -->
  <g transform="translate(230, 200)">
    <rect width="230" height="42" rx="21" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="115" y="26" class="uc-txt">CU-03: Rastrear Estado en Vivo</text>
  </g>

  <!-- CU-04: Gestión de Mesas -->
  <g transform="translate(230, 265)">
    <rect width="230" height="42" rx="21" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="115" y="26" class="uc-txt">CU-04: Atender y Asignar Mesas</text>
  </g>

  <!-- CU-05: Modificar Comanda -->
  <g transform="translate(230, 330)">
    <rect width="230" height="42" rx="21" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="115" y="26" class="uc-txt">CU-05: Modificar / Anular Pedido</text>
  </g>

  <!-- CU-09: Cobro y Cierre -->
  <g transform="translate(230, 395)">
    <rect width="230" height="42" rx="21" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="115" y="26" class="uc-txt">CU-09: Cobro y Cierre de Mesa</text>
  </g>

  <!-- Columna Derecha (x: 500 a 730) -->
  <!-- CU-06: Despacho KDS -->
  <g transform="translate(500, 70)">
    <rect width="230" height="42" rx="21" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="115" y="26" class="uc-txt">CU-06: Despachar Comandas KDS</text>
  </g>

  <!-- CU-07: Control de Existencias -->
  <g transform="translate(500, 135)">
    <rect width="230" height="42" rx="21" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="115" y="26" class="uc-txt">CU-07: Alerta Stock e Insumos</text>
  </g>

  <!-- CU-08: Gestión de Reservas -->
  <g transform="translate(500, 200)">
    <rect width="230" height="42" rx="21" fill="#FFFFFF" stroke="#059669" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="115" y="26" class="uc-txt">CU-08: Gesti&#243;n de Reservaciones</text>
  </g>

  <!-- CU-10: Arqueo y Caja -->
  <g transform="translate(500, 265)">
    <rect width="230" height="42" rx="21" fill="#FFFFFF" stroke="#059669" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="115" y="26" class="uc-txt">CU-10: Arqueo y Cuadre de Caja</text>
  </g>

  <!-- CU-11: Administración Global -->
  <g transform="translate(500, 330)">
    <rect width="230" height="42" rx="21" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="115" y="26" class="uc-txt">CU-11: Administrar Cat&#225;logo y Roles</text>
  </g>

  <!-- CU-12: Reportes y Métricas -->
  <g transform="translate(365, 455)">
    <rect width="230" height="42" rx="21" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <text x="115" y="26" class="uc-txt">CU-12: Reportes y Anal&#237;tica de Ventas</text>
  </g>

  <!-- ========================================== -->
  <!-- ACTORES EXTERNOS CON TARJETAS Y AVATARES   -->
  <!-- ========================================== -->
  <!-- Actor 1: Cliente (Izquierda Superior) -->
  <g transform="translate(25, 75)">
    <rect width="145" height="74" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <circle cx="72" cy="24" r="14" fill="#E0F2FE" />
    <path d="M68 28v-1.5a3 3 0 0 1 3-3h2a3 3 0 0 1 3 3v1.5M72 18a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="none" stroke="#0284C7" stroke-width="1.6" stroke-linecap="round"/>
    <text x="72" y="52" class="a-name">Cliente</text>
    <text x="72" y="65" class="a-sub">Comensal m&#243;vil</text>
  </g>

  <!-- Actor 2: Mesero (Izquierda Inferior) -->
  <g transform="translate(25, 350)">
    <rect width="145" height="74" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <circle cx="72" cy="24" r="14" fill="#FEF3C7" />
    <path d="M68 28v-1.5a3 3 0 0 1 3-3h2a3 3 0 0 1 3 3v1.5M72 18a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" fill="none" stroke="#D97706" stroke-width="1.6" stroke-linecap="round"/>
    <text x="72" y="52" class="a-name">Mesero</text>
    <text x="72" y="65" class="a-sub">Atenci&#243;n en mesa</text>
  </g>

  <!-- Actor 3: Cocina y Bar (Derecha Superior) -->
  <g transform="translate(790, 65)">
    <rect width="145" height="74" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <circle cx="72" cy="24" r="14" fill="#F3E8FF" />
    <path d="M67 26h10M69 16v10M75 16v10M68 14h8" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round"/>
    <text x="72" y="52" class="a-name">Cocina y Bar</text>
    <text x="72" y="65" class="a-sub">Despacho KDS</text>
  </g>

  <!-- Actor 4: Asistente / Cajero (Derecha Media) -->
  <g transform="translate(790, 225)">
    <rect width="145" height="74" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <circle cx="72" cy="24" r="14" fill="#DCFCE7" />
    <rect x="64" y="17" width="16" height="12" rx="2" fill="none" stroke="#059669" stroke-width="1.5"/>
    <line x1="64" y1="21" x2="80" y2="21" stroke="#059669" stroke-width="1.2"/>
    <text x="72" y="52" class="a-name">Asistente</text>
    <text x="72" y="65" class="a-sub">Reservas y caja</text>
  </g>

  <!-- Actor 5: Administrador (Derecha Inferior) -->
  <g transform="translate(790, 385)">
    <rect width="145" height="74" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.4" filter="url(#soft-shadow)"/>
    <circle cx="72" cy="24" r="14" fill="#EDE9FE" />
    <path d="M66 28h12M68 16h8v8h-8z" fill="none" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round"/>
    <text x="72" y="52" class="a-name">Administrador</text>
    <text x="72" y="65" class="a-sub">Gesti&#243;n global</text>
  </g>
</svg>
