<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" role="img" aria-labelledby="ucTitle ucDesc">
  <title id="ucTitle">Diagrama de Casos de Uso Animado &#8212; Sistema PuraSed</title>
  <desc id="ucDesc">Diagrama interactivo de casos de uso con flujo animado entre actores y funciones operativas.</desc>
  <defs>
    <style>
      :root {
        --canvas-bg: #FFFFFF;
        --bound-bg: #F8FAFC;
        --bound-border: #CBD5E1;
        --actor-card: #FFFFFF;
        --actor-border: #D0D7DE;
        --actor-ink: #1F3A4D;
        --actor-sub: #57606A;
        --uc-fill: #FFFFFF;
        --uc-border: #3D8FAE;
        --uc-ink: #1F3A4D;
        --flow-line: #0969DA;
        --flow-wire: #E2E8F0;
        --badge-blue: #0969DA;
        --badge-amber: #D98C2B;
        --badge-green: #2EA043;
        --badge-coral: #E4524F;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas-bg: #0D1117;
          --bound-bg: #161B22;
          --bound-border: #30363D;
          --actor-card: #1C2128;
          --actor-border: #30363D;
          --actor-ink: #F0F6FC;
          --actor-sub: #8B949E;
          --uc-fill: #1C2633;
          --uc-border: #58A6FF;
          --uc-ink: #E6EDF3;
          --flow-line: #58A6FF;
          --flow-wire: #21262D;
          --badge-blue: #58A6FF;
          --badge-amber: #F59E0B;
          --badge-green: #3FB950;
          --badge-coral: #F85149;
        }
      }

      .b-bound { fill: var(--bound-bg); stroke: var(--bound-border); stroke-width: 1.5; stroke-dasharray: 6 4; }
      .b-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; font-size: 13.5px; font-weight: 700; letter-spacing: 1.5px; fill: var(--actor-sub); }
      .a-card  { fill: var(--actor-card); stroke: var(--actor-border); stroke-width: 1.2; }
      .a-name  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; font-size: 12.5px; font-weight: 700; fill: var(--actor-ink); text-anchor: middle; }
      .a-sub   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; font-size: 10.5px; font-weight: 500; fill: var(--actor-sub); text-anchor: middle; }
      
      .uc-oval { fill: var(--uc-fill); stroke: var(--uc-border); stroke-width: 1.4; }
      .uc-txt  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; font-size: 11.5px; font-weight: 600; fill: var(--uc-ink); text-anchor: middle; }

      @keyframes flowWire {
        from { stroke-dashoffset: 24; }
        to   { stroke-dashoffset: 0; }
      }

      .flow-pulse {
        stroke: var(--flow-line);
        stroke-width: 1.8;
        stroke-dasharray: 6 5;
        animation: flowWire 1.5s linear infinite;
        fill: none;
      }

      .wire-base {
        stroke: var(--flow-wire);
        stroke-width: 1.8;
        fill: none;
      }

      .orbit { transform-origin: 32px 32px; animation: spin 24s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (prefers-reduced-motion: reduce) {
        .flow-pulse, .orbit { animation: none; }
      }
    </style>

    <filter id="uSh" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow flood-color="rgba(0,0,0,0.06)" dx="0" dy="3" stdDeviation="4"/>
    </filter>
  </defs>

  <!-- L&#205;MITE DEL SISTEMA -->
  <rect class="b-bound" x="180" y="20" width="600" height="498" rx="16"/>
  <text class="b-title" x="204" y="46">SISTEMA PURASED &#183; CASOS DE USO PRINCIPALES</text>

  <!-- L&#205;NEAS ANIMADAS (ACTORES -> CASOS DE USO) -->
  <!-- Cliente a Casos -->
  <path class="wire-base" d="M140 135 C180 135, 180 85, 230 85"/>
  <path class="flow-pulse" d="M140 135 C180 135, 180 85, 230 85"/>

  <path class="wire-base" d="M140 145 C180 145, 180 150, 230 150"/>
  <path class="flow-pulse" d="M140 145 C180 145, 180 150, 230 150"/>

  <path class="wire-base" d="M140 155 C180 155, 180 215, 230 215"/>
  <path class="flow-pulse" d="M140 155 C180 155, 180 215, 230 215"/>

  <path class="wire-base" d="M140 165 C180 165, 180 280, 230 280"/>
  <path class="flow-pulse" d="M140 165 C180 165, 180 280, 230 280"/>

  <path class="wire-base" d="M140 175 C180 175, 180 345, 230 345"/>
  <path class="flow-pulse" d="M140 175 C180 175, 180 345, 230 345"/>

  <path class="wire-base" d="M140 185 C180 185, 180 410, 230 410"/>
  <path class="flow-pulse" d="M140 185 C180 185, 180 410, 230 410"/>

  <!-- Mesero a Casos -->
  <path class="wire-base" d="M140 375 C180 375, 180 150, 230 150"/>
  <path class="flow-pulse" d="M140 375 C180 375, 180 150, 230 150"/>

  <path class="wire-base" d="M140 385 C180 385, 180 215, 230 215"/>
  <path class="flow-pulse" d="M140 385 C180 385, 180 215, 230 215"/>

  <!-- Cocina / Barra a Casos -->
  <path class="wire-base" d="M820 100 C780 100, 780 110, 730 110"/>
  <path class="flow-pulse" d="M820 100 C780 100, 780 110, 730 110"/>

  <path class="wire-base" d="M820 110 C780 110, 780 180, 730 180"/>
  <path class="flow-pulse" d="M820 110 C780 110, 780 180, 730 180"/>

  <!-- Asistente a Casos -->
  <path class="wire-base" d="M820 250 C780 250, 780 250, 730 250"/>
  <path class="flow-pulse" d="M820 250 C780 250, 780 250, 730 250"/>

  <!-- Administrador a Casos -->
  <path class="wire-base" d="M820 400 C780 400, 780 250, 730 250"/>
  <path class="flow-pulse" d="M820 400 C780 400, 780 250, 730 250"/>

  <path class="wire-base" d="M820 410 C780 410, 780 320, 730 320"/>
  <path class="flow-pulse" d="M820 410 C780 410, 780 320, 730 320"/>

  <path class="wire-base" d="M820 420 C780 420, 780 390, 730 390"/>
  <path class="flow-pulse" d="M820 420 C780 420, 780 390, 730 390"/>

  <!-- ACTORES IZQUIERDA (Badges enriquecidos con &#243;rbita animada) -->
  <!-- Actor: Cliente -->
  <g transform="translate(30, 95)">
    <rect class="a-card" x="0" y="0" width="130" height="120" rx="12" filter="url(#uSh)"/>
    <g transform="translate(33, 12)">
      <circle class="orbit" cx="32" cy="32" r="28" fill="none" stroke="var(--badge-blue)" stroke-width="1.4" stroke-dasharray="2 6"/>
      <circle cx="32" cy="32" r="23" fill="var(--badge-blue)" fill-opacity=".15"/>
      <!-- Icono Celular / Usuario -->
      <rect x="25" y="21" width="14" height="22" rx="3" fill="none" stroke="var(--badge-blue)" stroke-width="1.8"/>
      <line x1="30" y1="39" x2="34" y2="39" stroke="var(--badge-blue)" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text class="a-name" x="65" y="92">Cliente</text>
    <text class="a-sub" x="65" y="108">Mesa &#183; QR M&#243;vil</text>
  </g>

  <!-- Actor: Mesero -->
  <g transform="translate(30, 315)">
    <rect class="a-card" x="0" y="0" width="130" height="120" rx="12" filter="url(#uSh)"/>
    <g transform="translate(33, 12)">
      <circle class="orbit" cx="32" cy="32" r="28" fill="none" stroke="var(--badge-amber)" stroke-width="1.4" stroke-dasharray="2 6"/>
      <circle cx="32" cy="32" r="23" fill="var(--badge-amber)" fill-opacity=".15"/>
      <!-- Icono Bandeja / Servicio -->
      <path d="M20 34 h24 M24 34 a8 8 0 0 1 16 0" fill="none" stroke="var(--badge-amber)" stroke-width="1.8"/>
      <circle cx="32" cy="24" r="2" fill="var(--badge-amber)"/>
    </g>
    <text class="a-name" x="65" y="92">Mesero</text>
    <text class="a-sub" x="65" y="108">Tablet de Sal&#243;n</text>
  </g>

  <!-- ACTORES DERECHA -->
  <!-- Actor: Cocina / Barra -->
  <g transform="translate(800, 45)">
    <rect class="a-card" x="0" y="0" width="130" height="115" rx="12" filter="url(#uSh)"/>
    <g transform="translate(33, 10)">
      <circle class="orbit" cx="32" cy="32" r="28" fill="none" stroke="var(--badge-coral)" stroke-width="1.4" stroke-dasharray="2 6"/>
      <circle cx="32" cy="32" r="23" fill="var(--badge-coral)" fill-opacity=".15"/>
      <!-- Icono Chef / Copa -->
      <path d="M24 26 h16 l-3 12 h-10 Z" fill="none" stroke="var(--badge-coral)" stroke-width="1.8"/>
      <line x1="32" y1="38" x2="32" y2="44" stroke="var(--badge-coral)" stroke-width="1.8"/>
    </g>
    <text class="a-name" x="65" y="88">Cocina / Barra</text>
    <text class="a-sub" x="65" y="104">Despacho de &#193;rea</text>
  </g>

  <!-- Actor: Asistente -->
  <g transform="translate(800, 195)">
    <rect class="a-card" x="0" y="0" width="130" height="115" rx="12" filter="url(#uSh)"/>
    <g transform="translate(33, 10)">
      <circle class="orbit" cx="32" cy="32" r="28" fill="none" stroke="var(--badge-green)" stroke-width="1.4" stroke-dasharray="2 6"/>
      <circle cx="32" cy="32" r="23" fill="var(--badge-green)" fill-opacity=".15"/>
      <!-- Icono Calendario / Agenda -->
      <rect x="23" y="23" width="18" height="16" rx="2" fill="none" stroke="var(--badge-green)" stroke-width="1.8"/>
      <line x1="28" y1="20" x2="28" y2="23" stroke="var(--badge-green)" stroke-width="1.8"/>
      <line x1="36" y1="20" x2="36" y2="23" stroke="var(--badge-green)" stroke-width="1.8"/>
    </g>
    <text class="a-name" x="65" y="88">Asistente</text>
    <text class="a-sub" x="65" y="104">Reservas y Agenda</text>
  </g>

  <!-- Actor: Administrador -->
  <g transform="translate(800, 345)">
    <rect class="a-card" x="0" y="0" width="130" height="115" rx="12" filter="url(#uSh)"/>
    <g transform="translate(33, 10)">
      <circle class="orbit" cx="32" cy="32" r="28" fill="none" stroke="var(--badge-blue)" stroke-width="1.4" stroke-dasharray="2 6"/>
      <circle cx="32" cy="32" r="23" fill="var(--badge-blue)" fill-opacity=".15"/>
      <!-- Icono Escudo / Seguridad -->
      <path d="M32 20 L41 24 v6 c0 6 -4 10 -9 12 c-5 -2 -9 -6 -9 -12 v-6 Z" fill="none" stroke="var(--badge-blue)" stroke-width="1.8"/>
    </g>
    <text class="a-name" x="65" y="88">Administrador</text>
    <text class="a-sub" x="65" y="104">Gesti&#243;n y Auditor&#237;a</text>
  </g>

  <!-- CASOS DE USO (COLUMNA IZQUIERDA: CLIENTE / SAL&#211;N) -->
  <g transform="translate(230, 65)">
    <rect class="uc-oval" x="0" y="0" width="220" height="40" rx="20" filter="url(#uSh)"/>
    <text class="uc-txt" x="110" y="24">Consultar Men&#250; por QR</text>
  </g>

  <g transform="translate(230, 130)">
    <rect class="uc-oval" x="0" y="0" width="220" height="40" rx="20" filter="url(#uSh)"/>
    <text class="uc-txt" x="110" y="24">Registrar Pedido de Mesa</text>
  </g>

  <g transform="translate(230, 195)">
    <rect class="uc-oval" x="0" y="0" width="220" height="40" rx="20" filter="url(#uSh)"/>
    <text class="uc-txt" x="110" y="24">Seguimiento de Comanda</text>
  </g>

  <g transform="translate(230, 260)">
    <rect class="uc-oval" x="0" y="0" width="220" height="40" rx="20" filter="url(#uSh)"/>
    <text class="uc-txt" x="110" y="24">Reservar Mesa en L&#237;nea</text>
  </g>

  <g transform="translate(230, 325)">
    <rect class="uc-oval" x="0" y="0" width="220" height="40" rx="20" filter="url(#uSh)"/>
    <text class="uc-txt" x="110" y="24">Pagar Cuenta y Facturaci&#243;n</text>
  </g>

  <g transform="translate(230, 390)">
    <rect class="uc-oval" x="0" y="0" width="220" height="40" rx="20" filter="url(#uSh)"/>
    <text class="uc-txt" x="110" y="24">Calificar Atenci&#243;n y Servicio</text>
  </g>

  <!-- CASOS DE USO (COLUMNA DERECHA: BACKOFFICE / DESPACHO) -->
  <g transform="translate(510, 90)">
    <rect class="uc-oval" x="0" y="0" width="220" height="40" rx="20" filter="url(#uSh)"/>
    <text class="uc-txt" x="110" y="24">Despachar Comandas</text>
  </g>

  <g transform="translate(510, 160)">
    <rect class="uc-oval" x="0" y="0" width="220" height="40" rx="20" filter="url(#uSh)"/>
    <text class="uc-txt" x="110" y="24">Control de Stock e Insumos</text>
  </g>

  <g transform="translate(510, 230)">
    <rect class="uc-oval" x="0" y="0" width="220" height="40" rx="20" filter="url(#uSh)"/>
    <text class="uc-txt" x="110" y="24">Gestionar Agenda de Reservas</text>
  </g>

  <g transform="translate(510, 300)">
    <rect class="uc-oval" x="0" y="0" width="220" height="40" rx="20" filter="url(#uSh)"/>
    <text class="uc-txt" x="110" y="24">Habilitar Cobro y Arqueo</text>
  </g>

  <g transform="translate(510, 370)">
    <rect class="uc-oval" x="0" y="0" width="220" height="40" rx="20" filter="url(#uSh)"/>
    <text class="uc-txt" x="110" y="24">Reportes por Jornada y Bit&#225;cora</text>
  </g>
</svg>
