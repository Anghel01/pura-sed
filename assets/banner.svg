<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090f"/>
      <stop offset="45%" stop-color="#140b22"/>
      <stop offset="80%" stop-color="#240c2e"/>
      <stop offset="100%" stop-color="#0b0816"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlowMagenta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Liquid & Cocktail Gradients -->
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0077"/>
      <stop offset="50%" stop-color="#ff4400"/>
      <stop offset="100%" stop-color="#ffb700"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff0077" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ff88bb"/>
      <stop offset="80%" stop-color="#ff0077"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGradient)"/>
  <rect width="1200" height="340" rx="20" fill="none" stroke="#2d1d4d" stroke-width="2"/>

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="170" r="130" fill="#ff0077" opacity="0.18" filter="url(#neonGlowMagenta)"/>
  <circle cx="950" cy="80" r="110" fill="#00e5ff" opacity="0.12" filter="url(#neonGlowCyan)"/>
  <circle cx="650" cy="280" r="90" fill="#7928ca" opacity="0.15" filter="url(#neonGlowMagenta)"/>

  <!-- Grid overlay for tech look -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.04">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="1000" y1="0" x2="1000" y2="340"/>
  </g>

  <!-- COCKTAIL VECTOR ARTWORK (Left) -->
  <g transform="translate(110, 45)">
    <!-- Decorative background splash ring -->
    <circle cx="90" cy="120" r="85" fill="none" stroke="#ff0077" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>
    <circle cx="90" cy="120" r="70" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="8 6" opacity="0.3"/>

    <!-- Cocktail Glass Stem & Base -->
    <ellipse cx="90" cy="225" rx="42" ry="7" fill="none" stroke="url(#glassGrad)" stroke-width="3.5" filter="url(#neonGlowCyan)"/>
    <line x1="90" y1="135" x2="90" y2="225" stroke="url(#glassGrad)" stroke-width="4" filter="url(#neonGlowCyan)"/>

    <!-- Cocktail Glass Bowl -->
    <path d="M 30,55 L 90,135 L 150,55 Z" fill="none" stroke="url(#glassGrad)" stroke-width="4" stroke-linejoin="round" filter="url(#neonGlowCyan)"/>

    <!-- Liquid inside glass -->
    <path d="M 46,76 L 90,132 L 134,76 Q 90,82 46,76 Z" fill="url(#liquidGrad)" opacity="0.9" filter="url(#neonGlowMagenta)"/>

    <!-- Floating Ice Cube / Citrus slice -->
    <g transform="translate(85, 68) rotate(15)">
      <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#ffffff" opacity="0.5" stroke="#00e5ff" stroke-width="1.5"/>
    </g>

    <!-- Olive Pick / Stirrer Straw -->
    <line x1="65" y1="25" x2="105" y2="120" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlowCyan)"/>
    <!-- Garnish Neon Olive/Cherry -->
    <circle cx="68" cy="32" r="7" fill="#ff0055" stroke="#ffffff" stroke-width="1.5" filter="url(#neonGlowMagenta)"/>

    <!-- Rising Fizz Bubbles -->
    <circle cx="82" cy="100" r="2.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="98" cy="92" r="3" fill="#ffffff" opacity="0.7"/>
    <circle cx="75" cy="85" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="92" cy="78" r="3.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="108" cy="65" r="2" fill="#00e5ff" opacity="0.9"/>
  </g>

  <!-- TYPOGRAPHY & BRANDING (Center / Right) -->
  <g transform="translate(370, 75)">
    <!-- Top Sub-tag -->
    <rect x="0" y="0" width="240" height="26" rx="13" fill="#1f1035" stroke="#ff0077" stroke-width="1"/>
    <text x="120" y="17" fill="#ff77aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">
      BAR &amp; RESTAURANT SYSTEM
    </text>

    <!-- Main Title: PURA SED -->
    <text x="0" y="85" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Impact, sans-serif" font-size="64" font-weight="900" letter-spacing="3" filter="url(#neonGlowMagenta)">
      PURA SED
    </text>

    <!-- Description -->
    <text x="0" y="122" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Plataforma Integral de Comandas, Inventario y Despacho Automatizado
    </text>

    <!-- Institutional Badge line -->
    <text x="0" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      Escuela Politécnica Nacional (EPN) • FIEE • DASI Semestre 2026
    </text>

    <!-- Tech Pills -->
    <g transform="translate(0, 175)">
      <!-- Pill 1: .NET -->
      <rect x="0" y="0" width="95" height="28" rx="6" fill="#16122c" stroke="#512bd4" stroke-width="1.5"/>
      <text x="47" y="18" fill="#c4b5fd" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">.NET 10 / 9</text>

      <!-- Pill 2: Blazor -->
      <rect x="105" y="0" width="125" height="28" rx="6" fill="#16122c" stroke="#7928ca" stroke-width="1.5"/>
      <text x="167" y="18" fill="#e9d5ff" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Blazor WASM</text>

      <!-- Pill 3: Web API -->
      <rect x="240" y="0" width="165" height="28" rx="6" fill="#16122c" stroke="#00e5ff" stroke-width="1.5"/>
      <text x="322" y="18" fill="#a5f3fc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">ASP.NET Web API</text>

      <!-- Pill 4: SQL Server -->
      <rect x="415" y="0" width="120" height="28" rx="6" fill="#16122c" stroke="#ff0055" stroke-width="1.5"/>
      <text x="475" y="18" fill="#fecdd3" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">SQL Server</text>

      <!-- Pill 5: Jira Scrum -->
      <rect x="545" y="0" width="115" height="28" rx="6" fill="#16122c" stroke="#2563eb" stroke-width="1.5"/>
      <text x="602" y="18" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Jira Scrum</text>
    </g>
  </g>
</svg>
