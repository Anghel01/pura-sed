<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 48" width="100%" height="48">
  <defs>
    <style>
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .pill-sub { font-size: 10px; font-weight: 500; fill: #8DBBD0; }
    </style>
  </defs>

  <!-- Pill 1: .NET 10 -->
  <g transform="translate(10, 6)">
    <rect width="115" height="34" rx="7" fill="#1F3A4D" stroke="#31556e" stroke-width="1.2"/>
    <rect x="7" y="7" width="20" height="20" rx="4" fill="#512BD4"/>
    <text x="17" y="21" class="pill-text" font-size="10" text-anchor="middle">.N</text>
    <text x="35" y="22" class="pill-text">.NET 10</text>
  </g>

  <!-- Pill 2: Blazor WASM -->
  <g transform="translate(135, 6)">
    <rect width="160" height="34" rx="7" fill="#1F3A4D" stroke="#31556e" stroke-width="1.2"/>
    <rect x="7" y="7" width="20" height="20" rx="4" fill="#7928CA"/>
    <text x="17" y="21" class="pill-text" font-size="10" text-anchor="middle">B</text>
    <text x="35" y="22" class="pill-text">Blazor WebAssembly</text>
  </g>

  <!-- Pill 3: ASP.NET Core Web API -->
  <g transform="translate(305, 6)">
    <rect width="190" height="34" rx="7" fill="#1F3A4D" stroke="#31556e" stroke-width="1.2"/>
    <rect x="7" y="7" width="20" height="20" rx="4" fill="#00B4D8"/>
    <text x="17" y="21" class="pill-text" font-size="9" text-anchor="middle">API</text>
    <text x="35" y="22" class="pill-text">ASP.NET Core Web API</text>
  </g>

  <!-- Pill 4: SignalR -->
  <g transform="translate(505, 6)">
    <rect width="115" height="34" rx="7" fill="#1F3A4D" stroke="#31556e" stroke-width="1.2"/>
    <rect x="7" y="7" width="20" height="20" rx="4" fill="#E4524F"/>
    <text x="17" y="21" class="pill-text" font-size="9" text-anchor="middle">⚡</text>
    <text x="35" y="22" class="pill-text">SignalR</text>
  </g>

  <!-- Pill 5: EF Core -->
  <g transform="translate(630, 6)">
    <rect width="170" height="34" rx="7" fill="#1F3A4D" stroke="#31556e" stroke-width="1.2"/>
    <rect x="7" y="7" width="20" height="20" rx="4" fill="#68217A"/>
    <text x="17" y="21" class="pill-text" font-size="9" text-anchor="middle">EF</text>
    <text x="35" y="22" class="pill-text">Entity Framework Core</text>
  </g>

  <!-- Pill 6: SQL Server -->
  <g transform="translate(810, 6)">
    <rect width="130" height="34" rx="7" fill="#1F3A4D" stroke="#31556e" stroke-width="1.2"/>
    <rect x="7" y="7" width="20" height="20" rx="4" fill="#CC292B"/>
    <text x="17" y="21" class="pill-text" font-size="9" text-anchor="middle">SQL</text>
    <text x="35" y="22" class="pill-text">SQL Server</text>
  </g>
</svg>
