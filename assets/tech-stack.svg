<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 48" width="100%" height="48" role="img" aria-label="Stack tecnológico PuraSed">
  <style>
    svg { --bg: #FFFDF9; --bd: #D5CDC0; --ink: #1A201C; --muted: #574F49; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1F2421; --bd: #343D37; --ink: #F5EADB; --muted: #B5AA99; }
    }
    .pill-bg { fill: var(--bg); stroke: var(--bd); stroke-width: 1.2; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; fill: var(--ink); }
    .badge-txt { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9.5px; font-weight: 800; fill: #FFFDF9; }
  </style>

  <g transform="translate(10, 6)">
    <rect width="115" height="34" rx="5" class="pill-bg"/>
    <rect x="7" y="7" width="22" height="20" rx="4" fill="#9E5B08"/>
    <text x="18" y="20.5" class="badge-txt" text-anchor="middle">.N</text>
    <text x="36" y="21.5" class="pill-text">.NET 10</text>
  </g>
  <g transform="translate(135, 6)">
    <rect width="162" height="34" rx="5" class="pill-bg"/>
