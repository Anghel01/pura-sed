<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 230" width="560" height="230" role="img" aria-label="{{NAME}}, {{ROLE_TEXT}}">
  <defs>
    <style>
      :root { --card: #FFFFFF; --ink: #1F3A4D; --muted: #5B7383; --line: rgba(31,58,77,.10); --frame: rgba(31,58,77,.12); }
      @media (prefers-color-scheme: dark) {
        :root { --card: #161B22; --ink: #E6EDF3; --muted: #8B9BA8; --line: rgba(255,255,255,.08); --frame: rgba(255,255,255,.10); }
        .ds { flood-color: #000000; flood-opacity: .55; }
      }
      .card  { fill: var(--card); }
      .hole  { fill: var(--card); }
      .frame { fill: none; stroke: var(--frame); }
      .sep   { stroke: var(--line); }
      .ds    { flood-color: #1F3A4D; flood-opacity: .14; }
      .name  { font: 600 30px Georgia, 'Times New Roman', serif; fill: var(--ink); }
      .role  { font: 700 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px; fill: {{ACCENT}}; }
      .txt   { font: 400 17px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill: var(--muted); }
      .foot  { font: 600 15px ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; fill: {{ACCENT}}; }
      .mono  { font: 600 40px Georgia, 'Times New Roman', serif; fill: {{ACCENT}}; }
      .orbit { transform-origin: 104px 113px; animation: spin 32s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }
    </style>
    <filter id="sh" x="-6%" y="-10%" width="112%" height="128%">
      <feDropShadow class="ds" dx="0" dy="8" stdDeviation="9"/>
    </filter>
    <clipPath id="cardClip"><rect x="10" y="8" width="540" height="210" rx="20"/></clipPath>
    <clipPath id="avatarClip"><circle cx="104" cy="113" r="56"/></clipPath>
  </defs>

  <rect class="card" x="10" y="8" width="540" height="210" rx="20" filter="url(#sh)"/>
  <g clip-path="url(#cardClip)">
    <rect x="10" y="8" width="188" height="210" fill="{{ACCENT}}" fill-opacity=".09"/>
    <rect x="10" y="8" width="5" height="210" fill="{{ACCENT}}"/>
  </g>

  <circle class="orbit" cx="104" cy="113" r="70" fill="none" stroke="{{ACCENT}}" stroke-width="1.6" stroke-dasharray="2 7" stroke-linecap="round"/>
  <circle class="hole" cx="104" cy="113" r="61"/>
{{AVATAR}}
  <circle cx="104" cy="113" r="56" fill="none" stroke="{{ACCENT}}" stroke-width="3"/>

  <rect x="214" y="32" width="{{CHIPW}}" height="30" rx="15" fill="{{ACCENT}}" fill-opacity=".12"/>
  <text class="role" x="230" y="52">{{ROLE}}</text>
  <text class="name" x="214" y="104">{{NAME}}</text>
  <text class="txt" x="214" y="137">{{LINE1}}</text>
  <text class="txt" x="214" y="161">{{LINE2}}</text>
  <line class="sep" x1="214" y1="176" x2="526" y2="176"/>
  <text class="foot" x="214" y="201">{{FOOT}}</text>

  <rect class="frame" x="10.5" y="8.5" width="539" height="209" rx="19.5"/>
</svg>
