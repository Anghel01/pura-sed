<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="100%" role="img" aria-labelledby="modTitle modDesc">
  <title id="modTitle">Arquitectura Modular del Prototipo en Figma &#8212; PuraSed</title>
  <desc id="modDesc">Distribuci&#243;n interactiva de las 32 pantallas en Figma divididas en 3 subsistemas oficiales de equipo.</desc>
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-bd: #D8DEE4;
        --title-clr: #0F172A;
        --muted-clr: #57606A;
        --line-clr: #E2E8F0;
        --chip-bg: #F6F8FA;
        --chip-bd: #D0D7DE;
        --chip-tx: #1F2937;
        --foot-bg: #F8FAFC;
        --wire-clr: #CBD5E1;
        --flow-1: #D97706;
        --flow-2: #10B981;
        --pill-g-bg: #FEF3C7;
        --pill-g-tx: #B45309;
        --pill-e-bg: #ECFDF5;
        --pill-e-tx: #047857;
        --pill-i-bg: #EEF2FF;
        --pill-i-tx: #4338CA;
        --sh-clr: rgba(15, 23, 42, 0.07);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #161B22;
          --card-bd: #30363D;
          --title-clr: #F0F6FC;
          --muted-clr: #8B949E;
          --line-clr: #30363D;
          --chip-bg: #21262D;
          --chip-bd: #30363D;
          --chip-tx: #E6EDF3;
          --foot-bg: #0D1117;
          --wire-clr: #30363D;
          --flow-1: #F59E0B;
          --flow-2: #34D399;
          --pill-g-bg: rgba(245, 158, 11, 0.16);
          --pill-g-tx: #FCD34D;
          --pill-e-bg: rgba(16, 185, 129, 0.16);
          --pill-e-tx: #6EE7B7;
          --pill-i-bg: rgba(99, 102, 241, 0.18);
          --pill-i-tx: #A5B4FC;
          --sh-clr: rgba(0, 0, 0, 0.45);
        }
      }

      .m-card  { fill: var(--card-bg); stroke: var(--card-bd); stroke-width: 1.3; }
      .m-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 700; fill: var(--title-clr); }
      .m-owner { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .m-pill  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: 0.9px; }
      .m-chip  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: var(--chip-tx); }
      .m-foot  { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: 600; fill: var(--muted-clr); }
      .m-proto { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; font-weight: 700; fill: var(--muted-clr); letter-spacing: 0.6px; }

      @keyframes flowDash {
        from { stroke-dashoffset: 24; }
        to   { stroke-dashoffset: 0; }
      }
      .flow-gold {
        stroke: var(--flow-1);
        stroke-width: 2.2;
        stroke-dasharray: 6 5;
        animation: flowDash 1.3s linear infinite;
      }
      .flow-emerald {
        stroke: var(--flow-2);
        stroke-width: 2.2;
        stroke-dasharray: 6 5;
        animation: flowDash 1.3s linear infinite;
      }

      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      .icon-orbit {
        transform-box: fill-box;
        transform-origin: center;
        animation: spinSlow 14s linear infinite;
      }

      @keyframes pingPulse {
        0%   { transform: scale(1); opacity: 0.8; }
        70%  { transform: scale(2.1); opacity: 0; }
        100% { transform: scale(2.1); opacity: 0; }
      }
      .icon-ping {
        transform-box: fill-box;
        transform-origin: center;
        animation: pingPulse 2.2s ease-out infinite;
      }

      @keyframes barBreathe {
        0%, 100% { transform: scaleY(1); }
        50%      { transform: scaleY(0.65); }
      }
      .bar-1 { transform-box: fill-box; transform-origin: bottom; animation: barBreathe 2.1s ease-in-out infinite 0s; }
      .bar-2 { transform-box: fill-box; transform-origin: bottom; animation: barBreathe 2.1s ease-in-out infinite 0.4s; }
      .bar-3 { transform-box: fill-box; transform-origin: bottom; animation: barBreathe 2.1s ease-in-out infinite 0.8s; }

      @media (prefers-reduced-motion: reduce) {
        .flow-gold, .flow-emerald, .icon-orbit, .icon-ping, .bar-1, .bar-2, .bar-3 { animation: none; }
      }
    </style>

    <filter id="modSh" x="-4%" y="-6%" width="108%" height="118%">
      <feDropShadow flood-color="var(--sh-clr)" dx="0" dy="5" stdDeviation="6"/>
    </filter>

    <clipPath id="modClip1"><rect x="0" y="0" width="348" height="254" rx="14"/></clipPath>
    <clipPath id="modClip2"><rect x="0" y="0" width="348" height="254" rx="14"/></clipPath>
    <clipPath id="modClip3"><rect x="0" y="0" width="348" height="254" rx="14"/></clipPath>
  </defs>

  <!-- CONECTORES ANIMADOS ENTRE SUBSISTEMAS -->
  <!-- 1 -> 2: Comanda del Cliente hacia Cocina/Bar -->
  <line x1="368" y1="145" x2="420" y2="145" stroke="var(--wire-clr)" stroke-width="2.2"/>
  <line class="flow-gold" x1="368" y1="145" x2="420" y2="145"/>
  <polygon points="418,140 426,145 418,150" fill="var(--flow-1)"/>
  <text class="m-proto" x="397" y="132" text-anchor="middle">COMANDA</text>

  <!-- 2 -> 3: Despacho hacia Caja y Reportes -->
  <line x1="774" y1="145" x2="826" y2="145" stroke="var(--wire-clr)" stroke-width="2.2"/>
  <line class="flow-emerald" x1="774" y1="145" x2="826" y2="145"/>
  <polygon points="824,140 832,145 824,150" fill="var(--flow-2)"/>
  <text class="m-proto" x="803" y="132" text-anchor="middle">COBRO</text>

  <!-- ========================================================= -->
  <!-- MÓDULO 1: FRONT-OFFICE · MENÚ ORBITAL POS 3D (ANGELO) -->
  <!-- ========================================================= -->
  <g transform="translate(20, 18)">
    <rect class="m-card" x="0" y="0" width="348" height="254" rx="14" filter="url(#modSh)"/>
    <g clip-path="url(#modClip1)">
      <rect x="0" y="0" width="348" height="5" fill="#E59F38"/>
    </g>

    <!-- Icono Orbital 3D animado -->
    <g transform="translate(20, 20)">
      <circle cx="18" cy="18" r="18" fill="var(--pill-g-bg)"/>
      <circle class="icon-orbit" cx="18" cy="18" r="11" fill="none" stroke="#E59F38" stroke-width="1.6" stroke-dasharray="5 3"/>
      <circle cx="18" cy="18" r="4" fill="#E59F38"/>
    </g>

    <rect x="66" y="26" width="186" height="22" rx="11" fill="var(--pill-g-bg)"/>
    <text class="m-pill" x="159" y="40.5" text-anchor="middle" fill="var(--pill-g-tx)">1 &#183; FRONT-OFFICE &#183; COMENSAL</text>

    <text class="m-title" x="20" y="82">Men&#250; Orbital POS 3D</text>
    <text class="m-owner" x="20" y="102" fill="#E59F38">Angelo Conter&#243;n &#183; Frontend &amp; UI/UX Lead</text>

    <line x1="20" y1="116" x2="328" y2="116" stroke="var(--line-clr)" stroke-width="1"/>

    <!-- Grid 2x2 de pantallas -->
    <rect x="20" y="129" width="148" height="28" rx="8" fill="var(--chip-bg)" stroke="var(--chip-bd)"/>
    <text class="m-chip" x="94" y="147" text-anchor="middle">Bienvenida &amp; QR Mesa</text>

    <rect x="180" y="129" width="148" height="28" rx="8" fill="var(--chip-bg)" stroke="var(--chip-bd)"/>
    <text class="m-chip" x="254" y="147" text-anchor="middle">Cat&#225;logo 5 Cap&#237;tulos</text>

    <rect x="20" y="165" width="148" height="28" rx="8" fill="var(--chip-bg)" stroke="var(--chip-bd)"/>
    <text class="m-chip" x="94" y="183" text-anchor="middle">Drawer &amp; Timeline Live</text>

    <rect x="180" y="165" width="148" height="28" rx="8" fill="var(--chip-bg)" stroke="var(--chip-bd)"/>
    <text class="m-chip" x="254" y="183" text-anchor="middle">Pago, Factura &amp; Quiz</text>

    <!-- Pie técnico -->
    <rect x="20" y="206" width="308" height="28" rx="8" fill="var(--foot-bg)" stroke="var(--line-clr)"/>
    <text class="m-foot" x="174" y="224" text-anchor="middle">Three.js (-45&#176;) &#183; Ticket Tiza (1.2&#176;)</text>
  </g>

  <!-- ========================================================= -->
  <!-- MÓDULO 2: BACK-OFFICE · KDS / KDD Y SALÓN (JANNYS) -->
  <!-- ========================================================= -->
  <g transform="translate(426, 18)">
    <rect class="m-card" x="0" y="0" width="348" height="254" rx="14" filter="url(#modSh)"/>
    <g clip-path="url(#modClip2)">
      <rect x="0" y="0" width="348" height="5" fill="#10B981"/>
    </g>

    <!-- Icono Tiempo Real SignalR animado -->
    <g transform="translate(20, 20)">
      <circle cx="18" cy="18" r="18" fill="var(--pill-e-bg)"/>
      <circle class="icon-ping" cx="18" cy="18" r="8" fill="#10B981"/>
      <circle cx="18" cy="18" r="5" fill="#10B981"/>
    </g>

    <rect x="66" y="26" width="194" height="22" rx="11" fill="var(--pill-e-bg)"/>
    <text class="m-pill" x="163" y="40.5" text-anchor="middle" fill="var(--pill-e-tx)">2 &#183; BACK-OFFICE &#183; OPERATIVA</text>

    <text class="m-title" x="20" y="82">Cocina, Barra y Sal&#243;n</text>
    <text class="m-owner" x="20" y="102" fill="#10B981">Jannys Garrido &#183; Scrum Master &amp; Fullstack</text>

    <line x1="20" y1="116" x2="328" y2="116" stroke="var(--line-clr)" stroke-width="1"/>

    <!-- Grid 2x2 de pantallas -->
    <rect x="20" y="129" width="148" height="28" rx="8" fill="var(--chip-bg)" stroke="var(--chip-bd)"/>
    <text class="m-chip" x="94" y="147" text-anchor="middle">Login Personal RBAC</text>

    <rect x="180" y="129" width="148" height="28" rx="8" fill="var(--chip-bg)" stroke="var(--chip-bd)"/>
    <text class="m-chip" x="254" y="147" text-anchor="middle">KDD Barra Fermentos</text>

    <rect x="20" y="165" width="148" height="28" rx="8" fill="var(--chip-bg)" stroke="var(--chip-bd)"/>
    <text class="m-chip" x="94" y="183" text-anchor="middle">KDS Cocina de Paila</text>

    <rect x="180" y="165" width="148" height="28" rx="8" fill="var(--chip-bg)" stroke="var(--chip-bd)"/>
    <text class="m-chip" x="254" y="183" text-anchor="middle">Reservas &amp; Mapa Mesas</text>

    <!-- Pie técnico -->
    <rect x="20" y="206" width="308" height="28" rx="8" fill="var(--foot-bg)" stroke="var(--line-clr)"/>
    <text class="m-foot" x="174" y="224" text-anchor="middle">Enrutamiento SignalR &#183; Aislamiento KDS/KDD</text>
  </g>

  <!-- ========================================================= -->
  <!-- MÓDULO 3: BACK-OFFICE · CAJA Y ANALÍTICA (ÁNGEL) -->
  <!-- ========================================================= -->
  <g transform="translate(832, 18)">
    <rect class="m-card" x="0" y="0" width="348" height="254" rx="14" filter="url(#modSh)"/>
    <g clip-path="url(#modClip3)">
      <rect x="0" y="0" width="348" height="5" fill="#6366F1"/>
    </g>

    <!-- Icono Analítica con barras animadas -->
    <g transform="translate(20, 20)">
      <circle cx="18" cy="18" r="18" fill="var(--pill-i-bg)"/>
      <rect class="bar-1" x="10" y="17" width="3.5" height="9" rx="1.5" fill="#6366F1"/>
      <rect class="bar-2" x="16.2" y="11" width="3.5" height="15" rx="1.5" fill="#6366F1"/>
      <rect class="bar-3" x="22.5" y="14" width="3.5" height="12" rx="1.5" fill="#6366F1"/>
    </g>

    <rect x="66" y="26" width="194" height="22" rx="11" fill="var(--pill-i-bg)"/>
    <text class="m-pill" x="163" y="40.5" text-anchor="middle" fill="var(--pill-i-tx)">3 &#183; BACK-OFFICE &#183; GERENCIA</text>

    <text class="m-title" x="20" y="82">Caja, Stock y Anal&#237;tica</text>
    <text class="m-owner" x="20" y="102" fill="#6366F1">&#193;ngel Chicaiza &#183; Backend &amp; Data Architect</text>

    <line x1="20" y1="116" x2="328" y2="116" stroke="var(--line-clr)" stroke-width="1"/>

    <!-- Grid 2x2 de pantallas -->
    <rect x="20" y="129" width="148" height="28" rx="8" fill="var(--chip-bg)" stroke="var(--chip-bd)"/>
    <text class="m-chip" x="94" y="147" text-anchor="middle">Punto Caja &amp; Arqueo</text>

    <rect x="180" y="129" width="148" height="28" rx="8" fill="var(--chip-bg)" stroke="var(--chip-bd)"/>
    <text class="m-chip" x="254" y="147" text-anchor="middle">Stock &amp; Agotados</text>

    <rect x="20" y="165" width="148" height="28" rx="8" fill="var(--chip-bg)" stroke="var(--chip-bd)"/>
    <text class="m-chip" x="94" y="183" text-anchor="middle">Men&#250; &amp; Promociones</text>

    <rect x="180" y="165" width="148" height="28" rx="8" fill="var(--chip-bg)" stroke="var(--chip-bd)"/>
    <text class="m-chip" x="254" y="183" text-anchor="middle">8 Roles &amp; Bit&#225;cora</text>

    <!-- Pie técnico -->
    <rect x="20" y="206" width="308" height="28" rx="8" fill="var(--foot-bg)" stroke="var(--line-clr)"/>
    <text class="m-foot" x="174" y="224" text-anchor="middle">RBAC Estricto &#183; Auditor&#237;a &#183; Reportes Financieros</text>
  </g>
</svg>
