<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="100%" role="img" aria-labelledby="modTitle modDesc">
  <title id="modTitle">Arquitectura Modular del Prototipo en Figma &#8212; PuraSed</title>
  <desc id="modDesc">Distribuci&#243;n interactiva de pantallas en Figma divididas en 3 subsistemas del equipo en superficies neutras Figma y acentos multicolor.</desc>
  <defs>
    <style>
      :root {
        --card-bg: #FFFFFF;
        --card-bd: #E0E0E0;
        --title-clr: #1E1E1E;
        --muted-clr: #595959;
        --line-clr: #E0E0E0;
        --chip-bg: #F5F5F5;
        --chip-bd: #E0E0E0;
        --chip-tx: #1E1E1E;
        --foot-bg: #EFEFEF;
        --wire-clr: #BDBDBD;

        --m1-st: #F24E1E;
        --m1-tx: #9F1239;
        --m1-bg: #FFF1F2;

        --m2-st: #8B5CF6;
        --m2-tx: #5B21B6;
        --m2-bg: #F5F3FF;

        --m3-st: #059669;
        --m3-tx: #065F46;
        --m3-bg: #ECFDF5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: #2C2C2C;
          --card-bd: #484848;
          --title-clr: #FFFFFF;
          --muted-clr: #B3B3B3;
          --line-clr: #484848;
          --chip-bg: #383838;
          --chip-bd: #636363;
          --chip-tx: #FFFFFF;
          --foot-bg: #1E1E1E;
          --wire-clr: #636363;

          --m1-st: #FF7262;
          --m1-tx: #FDA4AF;
          --m1-bg: #381C23;

          --m2-st: #A78BFA;
          --m2-tx: #C4B5FD;
          --m2-bg: #27203B;

          --m3-st: #34D399;
          --m3-tx: #6EE7B7;
          --m3-bg: #163128;
        }
      }

      .m-card  { fill: var(--card-bg); stroke: var(--card-bd); stroke-width: 1.3; }
      .m-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 17.5px; font-weight: 800; fill: var(--title-clr); }
      .m-owner { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; }
      .m-pill  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 9.5px; font-weight: 800; letter-spacing: 0.6px; }
      .m-chip  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: var(--chip-tx); }
      .m-foot  { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: 600; fill: var(--muted-clr); }
      .m-proto { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 8.8px; font-weight: 800; fill: var(--muted-clr); letter-spacing: 0.5px; }

      @keyframes flowDash {
        from { stroke-dashoffset: 24; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      @keyframes pingPulse {
        0%   { transform: scale(1); opacity: 0.85; }
        70%  { transform: scale(2.1); opacity: 0; }
        100% { transform: scale(2.1); opacity: 0; }
      }
      @keyframes barBreathe {
        0%, 100% { transform: scaleY(1); }
        50%      { transform: scaleY(0.62); }
      }

      .flow-m1 { stroke: var(--m1-st); stroke-width: 2; stroke-dasharray: 6 5; animation: flowDash 1.4s linear infinite; }
      .flow-m2 { stroke: var(--m2-st); stroke-width: 2; stroke-dasharray: 6 5; animation: flowDash 1.4s linear infinite; }
      .icon-orbit { transform-box: fill-box; transform-origin: center; animation: spinSlow 16s linear infinite; }
      .icon-ping  { transform-box: fill-box; transform-origin: center; animation: pingPulse 2.3s ease-out infinite; }
      .bar-1 { transform-box: fill-box; transform-origin: bottom; animation: barBreathe 2.2s ease-in-out infinite 0s; }
      .bar-2 { transform-box: fill-box; transform-origin: bottom; animation: barBreathe 2.2s ease-in-out infinite 0.4s; }
      .bar-3 { transform-box: fill-box; transform-origin: bottom; animation: barBreathe 2.2s ease-in-out infinite 0.8s; }

      @media (prefers-reduced-motion: reduce) {
        .flow-m1, .flow-m2, .icon-orbit, .icon-ping, .bar-1, .bar-2, .bar-3 { animation: none; }
      }
    </style>

    <clipPath id="modClip1"><rect x="0" y="0" width="348" height="254" rx="8"/></clipPath>
    <clipPath id="modClip2"><rect x="0" y="0" width="348" height="254" rx="8"/></clipPath>
    <clipPath id="modClip3"><rect x="0" y="0" width="348" height="254" rx="8"/></clipPath>
  </defs>

  <!-- Conectores animados -->
  <line x1="368" y1="145" x2="420" y2="145" stroke="var(--wire-clr)" stroke-width="2"/>
  <line class="flow-m1" x1="368" y1="145" x2="420" y2="145"/>
  <polygon points="418,140 426,145 418,150" fill="var(--m1-st)"/>
  <rect x="366" y="114" width="62" height="16" rx="3" fill="var(--card-bg)" stroke="var(--card-bd)" stroke-width="1"/>
  <text class="m-proto" x="397" y="125" text-anchor="middle">COMANDA</text>

  <line x1="774" y1="145" x2="826" y2="145" stroke="var(--wire-clr)" stroke-width="2"/>
  <line class="flow-m2" x1="774" y1="145" x2="826" y2="145"/>
  <polygon points="824,140 832,145 824,150" fill="var(--m2-st)"/>
  <rect x="776" y="114" width="54" height="16" rx="3" fill="var(--card-bg)" stroke="var(--card-bd)" stroke-width="1"/>
  <text class="m-proto" x="803" y="125" text-anchor="middle">COBRO</text>

  <!-- MODULO 1: FRONT-OFFICE (ORO INTI) -->
  <g transform="translate(20, 18)">
    <rect class="m-card" x="0" y="0" width="348" height="254" rx="8"/>
    <g clip-path="url(#modClip1)"><rect x="0" y="0" width="348" height="4" fill="var(--m1-st)"/></g>

    <g transform="translate(20, 20)">
      <circle cx="18" cy="18" r="18" fill="var(--m1-bg)"/>
      <circle class="icon-orbit" cx="18" cy="18" r="11" fill="none" stroke="var(--m1-st)" stroke-width="1.6" stroke-dasharray="5 3"/>
      <circle cx="18" cy="18" r="4" fill="var(--m1-st)"/>
    </g>

    <rect x="66" y="27" width="194" height="22" rx="4" fill="var(--m1-bg)"/>
    <text class="m-pill" x="163" y="41.5" text-anchor="middle" fill="var(--m1-tx)">1 &#183; FRONT-OFFICE &#183; COMENSAL</text>

    <text class="m-title" x="20" y="82">Men&#250; Orbital POS 3D</text>
    <text class="m-owner" x="20" y="102" fill="var(--m1-tx)">Angelo Conter&#243;n &#183; Frontend &amp; UI/UX Lead</text>
    <line x1="20" y1="116" x2="328" y2="116" stroke="var(--line-clr)" stroke-width="1"/>

    <rect x="20" y="129" width="148" height="28" rx="4" fill="var(--chip-bg)" stroke="var(--chip-bd)"/><text class="m-chip" x="94" y="147" text-anchor="middle">Bienvenida &amp; QR Mesa</text>
    <rect x="180" y="129" width="148" height="28" rx="4" fill="var(--chip-bg)" stroke="var(--chip-bd)"/><text class="m-chip" x="254" y="147" text-anchor="middle">Cat&#225;logo 5 Cap&#237;tulos</text>
    <rect x="20" y="165" width="148" height="28" rx="4" fill="var(--chip-bg)" stroke="var(--chip-bd)"/><text class="m-chip" x="94" y="183" text-anchor="middle">Drawer &amp; Timeline Live</text>
    <rect x="180" y="165" width="148" height="28" rx="4" fill="var(--chip-bg)" stroke="var(--chip-bd)"/><text class="m-chip" x="254" y="183" text-anchor="middle">Pago, Factura &amp; Quiz</text>

    <rect x="20" y="206" width="308" height="28" rx="4" fill="var(--foot-bg)" stroke="var(--line-clr)"/>
    <text class="m-foot" x="174" y="224" text-anchor="middle">Three.js (-45&#176;) &#183; Ticket Tiza (1.2&#176;)</text>
  </g>

  <!-- MODULO 2: BACK-OFFICE OPERATIVA (TERRACOTA) -->
  <g transform="translate(426, 18)">
    <rect class="m-card" x="0" y="0" width="348" height="254" rx="8"/>
    <g clip-path="url(#modClip2)"><rect x="0" y="0" width="348" height="4" fill="var(--m2-st)"/></g>

    <g transform="translate(20, 20)">
      <circle cx="18" cy="18" r="18" fill="var(--m2-bg)"/>
      <circle class="icon-ping" cx="18" cy="18" r="7" fill="var(--m2-st)"/>
      <circle cx="18" cy="18" r="4.5" fill="var(--m2-st)"/>
    </g>

    <rect x="66" y="27" width="198" height="22" rx="4" fill="var(--m2-bg)"/>
    <text class="m-pill" x="165" y="41.5" text-anchor="middle" fill="var(--m2-tx)">2 &#183; BACK-OFFICE &#183; OPERATIVA</text>

    <text class="m-title" x="20" y="82">Cocina, Barra y Sal&#243;n</text>
    <text class="m-owner" x="20" y="102" fill="var(--m2-tx)">Jannys Garrido &#183; Scrum Master &amp; Fullstack</text>
    <line x1="20" y1="116" x2="328" y2="116" stroke="var(--line-clr)" stroke-width="1"/>

    <rect x="20" y="129" width="148" height="28" rx="4" fill="var(--chip-bg)" stroke="var(--chip-bd)"/><text class="m-chip" x="94" y="147" text-anchor="middle">Login Personal RBAC</text>
    <rect x="180" y="129" width="148" height="28" rx="4" fill="var(--chip-bg)" stroke="var(--chip-bd)"/><text class="m-chip" x="254" y="147" text-anchor="middle">KDD Barra Fermentos</text>
    <rect x="20" y="165" width="148" height="28" rx="4" fill="var(--chip-bg)" stroke="var(--chip-bd)"/><text class="m-chip" x="94" y="183" text-anchor="middle">KDS Cocina de Paila</text>
    <rect x="180" y="165" width="148" height="28" rx="4" fill="var(--chip-bg)" stroke="var(--chip-bd)"/><text class="m-chip" x="254" y="183" text-anchor="middle">Reservas &amp; Mapa Mesas</text>

    <rect x="20" y="206" width="308" height="28" rx="4" fill="var(--foot-bg)" stroke="var(--line-clr)"/>
    <text class="m-foot" x="174" y="224" text-anchor="middle">Enrutamiento SignalR &#183; Aislamiento KDS/KDD</text>
  </g>

  <!-- MODULO 3: BACK-OFFICE GERENCIA (SABIA) -->
  <g transform="translate(832, 18)">
    <rect class="m-card" x="0" y="0" width="348" height="254" rx="8"/>
    <g clip-path="url(#modClip3)"><rect x="0" y="0" width="348" height="4" fill="var(--m3-st)"/></g>

    <g transform="translate(20, 20)">
      <circle cx="18" cy="18" r="18" fill="var(--m3-bg)"/>
      <rect class="bar-1" x="10"   y="17" width="3.5" height="9"  rx="1" fill="var(--m3-st)"/>
      <rect class="bar-2" x="16.2" y="11" width="3.5" height="15" rx="1" fill="var(--m3-st)"/>
      <rect class="bar-3" x="22.5" y="14" width="3.5" height="12" rx="1" fill="var(--m3-st)"/>
    </g>

    <rect x="66" y="27" width="194" height="22" rx="4" fill="var(--m3-bg)"/>
    <text class="m-pill" x="163" y="41.5" text-anchor="middle" fill="var(--m3-tx)">3 &#183; BACK-OFFICE &#183; GERENCIA</text>

    <text class="m-title" x="20" y="82">Caja, Stock y Anal&#237;tica</text>
    <text class="m-owner" x="20" y="102" fill="var(--m3-tx)">&#193;ngel Chicaiza &#183; Backend &amp; Data Architect</text>
    <line x1="20" y1="116" x2="328" y2="116" stroke="var(--line-clr)" stroke-width="1"/>

    <rect x="20" y="129" width="148" height="28" rx="4" fill="var(--chip-bg)" stroke="var(--chip-bd)"/><text class="m-chip" x="94" y="147" text-anchor="middle">Punto Caja &amp; Arqueo</text>
    <rect x="180" y="129" width="148" height="28" rx="4" fill="var(--chip-bg)" stroke="var(--chip-bd)"/><text class="m-chip" x="254" y="147" text-anchor="middle">Stock &amp; Agotados</text>
    <rect x="20" y="165" width="148" height="28" rx="4" fill="var(--chip-bg)" stroke="var(--chip-bd)"/><text class="m-chip" x="94" y="183" text-anchor="middle">Men&#250; &amp; Promociones</text>
    <rect x="180" y="165" width="148" height="28" rx="4" fill="var(--chip-bg)" stroke="var(--chip-bd)"/><text class="m-chip" x="254" y="183" text-anchor="middle">Roles, Bit&#225;cora &amp; BI</text>

    <rect x="20" y="206" width="308" height="28" rx="4" fill="var(--foot-bg)" stroke="var(--line-clr)"/>
    <text class="m-foot" x="174" y="224" text-anchor="middle">Liquidaci&#243;n Ticket &#183; Auditor&#237;a &amp; Reportes</text>
  </g>
</svg>
