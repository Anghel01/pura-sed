<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 356" width="100%" height="100%" role="img" aria-labelledby="secTitle secDesc">
  <title id="secTitle">Seguridad ASP.NET Core Identity, JWT Bearer y Matriz RBAC PuraSed</title>
  <desc id="secDesc">Pipeline animado de autenticaci&#243;n JWT Bearer HMAC-SHA256 y distribuci&#243;n DRY de los 8 roles en Roles.cs.</desc>
  <defs>
    <style>
      :root {
        --bg: #FAF7EC;
        --card: #FFFDF9;
        --alt: #F2EDE0;
        --bd: #D5CDC0;
        --ink: #1A201C;
        --muted: #574F49;

        --pizarra-st: #405A6E;
        --pizarra-tx: #2F4658;
        --pizarra-bg: rgba(64, 90, 110, 0.12);

        --sage-st: #50694E;
        --sage-tx: #3D523B;
        --sage-bg: rgba(99, 119, 97, 0.14);

        --gold-st: #C27416;
        --gold-tx: #9E5B08;
        --gold-bg: rgba(229, 159, 56, 0.14);

        --terra-st: #B85335;
        --terra-tx: #9E3E22;
        --terra-bg: rgba(184, 83, 53, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121614;
          --card: #1F2421;
          --alt: #171C19;
          --bd: #313934;
          --ink: #F5EADB;
          --muted: #B5AA99;

          --pizarra-st: #6D93B0;
          --pizarra-tx: #8EB2CE;
          --pizarra-bg: rgba(64, 90, 110, 0.22);

          --sage-st: #7C9D79;
          --sage-tx: #9EC09B;
          --sage-bg: rgba(99, 119, 97, 0.18);

          --gold-st: #E59F38;
          --gold-tx: #F8AD00;
          --gold-bg: rgba(229, 159, 56, 0.18);

          --terra-st: #D46C4E;
          --terra-tx: #E68A6E;
          --terra-bg: rgba(184, 83, 53, 0.18);
        }
      }

      .s-canvas  { fill: var(--bg); stroke: var(--bd); stroke-width: 1.3; }
      .s-card    { fill: var(--card); stroke: var(--bd); stroke-width: 1.25; }
      .s-pill    { fill: var(--alt); stroke: var(--bd); stroke-width: 1; }
      .s-pipe    { fill: var(--card); stroke: var(--bd); stroke-width: 1.2; }

      .s-h1      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16.5px; font-weight: 800; fill: var(--ink); }
      .s-h2      { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 500; fill: var(--muted); }
      .s-title   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14.5px; font-weight: 800; fill: var(--ink); }
      .s-chip    { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: var(--ink); text-anchor: middle; }
      .s-foot    { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: var(--muted); text-anchor: middle; }
      .s-mono    { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
      .s-lbl     { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: 0.6px; }
      .s-flowlbl { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9px; font-weight: 800; letter-spacing: 0.8px; text-anchor: middle; }

      @keyframes shieldOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes tokenFlow   { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
      @keyframes radarSec    { 0% { transform: scale(1); opacity: 0.85; } 70% { transform: scale(2.2); opacity: 0; } 100% { transform: scale(2.2); opacity: 0; } }
      @keyframes nodeGlow    { 0%, 100% { opacity: 0.95; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.18); } }

      .sec-orbit    { transform-box: fill-box; transform-origin: center; animation: shieldOrbit 24s linear infinite; }
      .sec-stream-1 { stroke-dasharray: 5 4; animation: tokenFlow 1.4s linear infinite; }
      .sec-stream-2 { stroke-dasharray: 5 4; animation: tokenFlow 1.4s linear infinite; }
      .sec-radar    { transform-box: fill-box; transform-origin: center; animation: radarSec 2.3s ease-out infinite; }
      .sec-glow     { transform-box: fill-box; transform-origin: center; animation: nodeGlow 2.8s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .sec-orbit, .sec-stream-1, .sec-stream-2, .sec-radar, .sec-glow { animation: none; }
      }
    </style>

    <clipPath id="secClip1"><rect x="28"  y="146" width="366" height="184" rx="7"/></clipPath>
    <clipPath id="secClip2"><rect x="417" y="146" width="366" height="184" rx="7"/></clipPath>
    <clipPath id="secClip3"><rect x="806" y="146" width="366" height="184" rx="7"/></clipPath>
  </defs>

  <rect class="s-canvas" x="2" y="2" width="1196" height="352" rx="10"/>

  <!-- Cabecera -->
  <g transform="translate(50, 44)">
    <circle class="sec-orbit" cx="0" cy="0" r="22" fill="none" stroke="var(--pizarra-st)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.85"/>
    <circle cx="0" cy="0" r="16" fill="var(--pizarra-bg)"/>
    <path d="M 0 -10 L 8 -6.5 V 1 C 8 6.2 4.5 10.4 0 12 C -4.5 10.4 -8 6.2 -8 1 V -6.5 Z" fill="var(--pizarra-st)"/>
    <path d="M -3 1 L -0.8 3.2 L 3.8 -1.8" fill="none" stroke="#FFFDF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="86" y="40" class="s-h1">Seguridad JWT Bearer &amp; Matriz de Roles RBAC</text>
  <text x="86" y="59" class="s-h2">ASP.NET Core Identity &#183; Firma HMAC-SHA256 &#183; Pol&#237;ticas DRY centralizadas en Roles.cs</text>

  <rect x="920" y="28" width="252" height="28" rx="4" fill="var(--sage-bg)" stroke="var(--sage-st)" stroke-width="1"/>
  <circle class="sec-radar" cx="938" cy="42" r="4" fill="var(--sage-st)"/>
  <circle cx="938" cy="42" r="3.2" fill="var(--sage-st)"/>
  <text x="950" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5px" font-weight="700" fill="var(--sage-tx)">8 Roles &#183; IdentitySeeder Activo</text>

  <!-- Pipeline JWT -->
  <rect class="s-pipe" x="28" y="84" width="240" height="38" rx="5"/>
  <circle cx="46" cy="103" r="4" fill="var(--pizarra-st)"/>
  <text x="155" y="107" class="s-mono">POST /api/Auth/login</text>

  <path d="M 274 103 L 358 103" fill="none" stroke="var(--terra-st)" stroke-width="2" class="sec-stream-1"/>
  <polygon points="356,99 365,103 356,107" fill="var(--terra-st)"/>
  <text x="319" y="96" class="s-flowlbl" fill="var(--terra-tx)">IDENTITY</text>

  <rect class="s-pipe" x="370" y="84" width="256" height="38" rx="5"/>
  <circle cx="388" cy="103" r="4" fill="var(--terra-st)"/>
  <text x="506" y="107" class="s-mono">TokenService &#183; Claims + Rol</text>

  <path d="M 632 103 L 716 103" fill="none" stroke="var(--gold-st)" stroke-width="2" class="sec-stream-2"/>
  <polygon points="714,99 723,103 714,107" fill="var(--gold-st)"/>
  <text x="677" y="96" class="s-flowlbl" fill="var(--gold-tx)">BEARER JWT</text>

  <rect class="s-pipe" x="728" y="84" width="444" height="38" rx="5"/>
  <circle cx="746" cy="103" r="4" fill="var(--gold-st)"/>
  <text x="958" y="107" class="s-mono">[Authorize(Roles = Roles.*)] &#8594; Endpoints Protegidos</text>

  <!-- BLOQUE 1: NIVEL GERENCIAL -->
  <g transform="translate(28, 146)">
    <rect class="s-card" width="366" height="184" rx="7"/>
  </g>
  <g clip-path="url(#secClip1)"><rect x="28" y="146" width="366" height="4" fill="var(--pizarra-st)"/></g>
  <g transform="translate(28, 146)">
    <circle cx="28" cy="30" r="10" fill="var(--pizarra-bg)"/>
    <circle class="sec-glow" cx="28" cy="30" r="4.5" fill="var(--pizarra-st)"/>
    <text x="48" y="25" class="s-lbl" fill="var(--pizarra-tx)">1 &#183; GESTI&#211;N Y RESERVAS &#183; RBAC</text>
    <text x="48" y="45" class="s-title">SuperAdmin &#183; Admin &#183; Asistente</text>

    <rect class="s-pill" x="18"  y="68" width="158" height="30" rx="4"/><text x="97"  y="87" class="s-chip">Cat&#225;logo y Promociones</text>
    <rect class="s-pill" x="190" y="68" width="158" height="30" rx="4"/><text x="269" y="87" class="s-chip">Caja, Cobros y Facturas</text>
    <rect class="s-pill" x="18"  y="108" width="158" height="30" rx="4"/><text x="97"  y="127" class="s-chip">Reservas y Mesas (HU-18)</text>
    <rect class="s-pill" x="190" y="108" width="158" height="30" rx="4"/><text x="269" y="127" class="s-chip">Usuarios y Bit&#225;cora Audit</text>
    <text x="183" y="164" class="s-foot">Cuentas seed: admin &#183; asistente</text>
  </g>

  <!-- BLOQUE 2: OPERACIÓN EN PISO -->
  <g transform="translate(417, 146)">
    <rect class="s-card" width="366" height="184" rx="7"/>
  </g>
  <g clip-path="url(#secClip2)"><rect x="417" y="146" width="366" height="4" fill="var(--terra-st)"/></g>
  <g transform="translate(417, 146)">
    <circle cx="28" cy="30" r="10" fill="var(--terra-bg)"/>
    <circle class="sec-glow" cx="28" cy="30" r="4.5" fill="var(--terra-st)" style="animation-delay: 0.7s"/>
    <text x="48" y="25" class="s-lbl" fill="var(--terra-tx)">2 &#183; OPERATIVO &#183; TodosPersonal</text>
    <text x="48" y="45" class="s-title">Mesero &#183; AdminCocina &#183; AdminBar</text>

    <rect class="s-pill" x="18"  y="68" width="158" height="30" rx="4"/><text x="97"  y="87" class="s-chip">Toma de Pedidos (HU-13)</text>
    <rect class="s-pill" x="190" y="68" width="158" height="30" rx="4"/><text x="269" y="87" class="s-chip">KDS Cocina (AdminCocina)</text>
    <rect class="s-pill" x="18"  y="108" width="158" height="30" rx="4"/><text x="97"  y="127" class="s-chip">KDD Fermentos (AdminBar)</text>
    <rect class="s-pill" x="190" y="108" width="158" height="30" rx="4"/><text x="269" y="127" class="s-chip">Control Stock y Agotados</text>
    <text x="183" y="164" class="s-foot">Cuentas seed: mesero &#183; cocina &#183; bar</text>
  </g>

  <!-- BLOQUE 3: COMENSALES Y ACCESO -->
  <g transform="translate(806, 146)">
    <rect class="s-card" width="366" height="184" rx="7"/>
  </g>
  <g clip-path="url(#secClip3)"><rect x="806" y="146" width="366" height="4" fill="var(--gold-st)"/></g>
  <g transform="translate(806, 146)">
    <circle cx="28" cy="30" r="10" fill="var(--gold-bg)"/>
    <circle class="sec-glow" cx="28" cy="30" r="4.5" fill="var(--gold-st)" style="animation-delay: 1.4s"/>
    <text x="48" y="25" class="s-lbl" fill="var(--gold-tx)">3 &#183; COMENSAL &#183; TomaPedidos</text>
    <text x="48" y="45" class="s-title">Cliente &#183; Usuario Registrado</text>

    <rect class="s-pill" x="18"  y="68" width="158" height="30" rx="4"/><text x="97"  y="87" class="s-chip">Auto-Orden Tablet / QR</text>
    <rect class="s-pill" x="190" y="68" width="158" height="30" rx="4"/><text x="269" y="87" class="s-chip">Timeline Comanda en Vivo</text>
    <rect class="s-pill" x="18"  y="108" width="158" height="30" rx="4"/><text x="97"  y="127" class="s-chip">Pago Digital &amp; Factura PDF</text>
    <rect class="s-pill" x="190" y="108" width="158" height="30" rx="4"/><text x="269" y="127" class="s-chip">Encuesta Satisfacci&#243;n</text>
    <text x="183" y="164" class="s-foot">Cuenta seed: cliente &#183; /api/Auth/register</text>
  </g>
</svg>
