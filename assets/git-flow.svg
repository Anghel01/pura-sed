<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 245" width="100%" height="100%" role="img" aria-labelledby="gitTitle gitDesc">
  <title id="gitTitle">Estrategia GitFlow PuraSed</title>
  <desc id="gitDesc">Flujo animado de ramas GitFlow entre main, develop y ramas feature por historia de usuario en paleta suave y clara Brisa PuraSed.</desc>
  <defs>
    <style>
      :root {
        --bg: #F7FBFE;
        --bar: #FFFFFF;
        --bd: #D2E3F0;
        --txt: #152336;
        --sub: #4B6178;
        --track: #DCE9F3;

        --main-st: #2BA36D;
        --main-tx: #136740;
        --main-bg: #E8F9F1;

        --dev-st: #2E98BE;
        --dev-tx: #0C5F7D;
        --dev-bg: #E7F6FC;

        --f1-st: #6D76E4;
        --f1-tx: #3C43A1;
        --f1-bg: #F0F1FE;

        --f2-st: #DF5E55;
        --f3-st: #D08414;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0E1626;
          --bar: #152033;
          --bd: #2B3D59;
          --txt: #F1F6FC;
          --sub: #9FB3CB;
          --track: #2B3D59;

          --main-st: #6AD3A2;
          --main-tx: #8EE2BA;
          --main-bg: #122C26;

          --dev-st: #74C6DF;
          --dev-tx: #94D9EE;
          --dev-bg: #132A3C;

          --f1-st: #A1A8F7;
          --f1-tx: #C1C6FB;
          --f1-bg: #1D2240;

          --f2-st: #F28B82;
          --f3-st: #F6C25E;
        }
      }

      .g-win    { fill: var(--bg); stroke: var(--bd); stroke-width: 1.3; }
      .g-top    { fill: var(--bar); }
      .g-lbl    { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .g-sub    { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 500; fill: var(--sub); }
      .g-node-t { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: var(--sub); text-anchor: middle; }

      @keyframes gitDash { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
      @keyframes headPulse { 0% { transform: scale(1); opacity: 0.85; } 70% { transform: scale(2.2); opacity: 0; } 100% { transform: scale(2.2); opacity: 0; } }
      @keyframes commitBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.16); } }

      .g-flow-m { stroke-dasharray: 6 5; animation: gitDash 2.2s linear infinite; }
      .g-flow-d { stroke-dasharray: 6 4; animation: gitDash 1.4s linear infinite; }
      .g-flow-f { stroke-dasharray: 5 4; animation: gitDash 1.7s linear infinite; }
      .g-head-ring { transform-box: fill-box; transform-origin: center; animation: headPulse 2.3s ease-out infinite; }
      .g-c1 { transform-box: fill-box; transform-origin: center; animation: commitBreath 3s ease-in-out infinite 0s; }
      .g-c2 { transform-box: fill-box; transform-origin: center; animation: commitBreath 3s ease-in-out infinite 1s; }
      .g-c3 { transform-box: fill-box; transform-origin: center; animation: commitBreath 3s ease-in-out infinite 2s; }

      @media (prefers-reduced-motion: reduce) {
        .g-flow-m, .g-flow-d, .g-flow-f, .g-head-ring, .g-c1, .g-c2, .g-c3 { animation: none; }
      }
    </style>

    <clipPath id="gitClip"><rect x="2" y="2" width="996" height="241" rx="8"/></clipPath>
  </defs>

  <rect class="g-win" x="2" y="2" width="996" height="241" rx="8"/>
  <g clip-path="url(#gitClip)">
    <rect class="g-top" x="2" y="2" width="996" height="40"/>
    <line x1="2" y1="42" x2="998" y2="42" stroke="var(--bd)" stroke-width="1"/>
  </g>

  <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13px" font-weight="800" fill="var(--txt)">Modelo GitFlow &#183; Flujo de Integraci&#243;n Continua</text>
  <rect x="716" y="10" width="260" height="22" rx="11" fill="var(--dev-bg)" stroke="var(--dev-st)" stroke-width="1"/>
  <circle class="g-head-ring" cx="731" cy="21" r="4" fill="var(--dev-st)"/>
  <circle cx="731" cy="21" r="3" fill="var(--dev-st)"/>
  <text x="743" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5px" font-weight="700" fill="var(--dev-tx)">Rama Activa: develop (HEAD Sprint 3)</text>

  <!-- Carril etiquetas izquierdas -->
  <rect x="24" y="68" width="114" height="24" rx="4" fill="var(--main-bg)" stroke="var(--main-st)" stroke-width="1"/>
  <text x="81" y="84" class="g-lbl" fill="var(--main-tx)">main</text>
  <text x="24" y="106" class="g-sub">Producci&#243;n estable</text>

  <rect x="24" y="128" width="114" height="24" rx="4" fill="var(--dev-bg)" stroke="var(--dev-st)" stroke-width="1"/>
  <text x="81" y="144" class="g-lbl" fill="var(--dev-tx)">develop</text>
  <text x="24" y="166" class="g-sub">Integraci&#243;n del equipo</text>

  <rect x="24" y="188" width="114" height="24" rx="4" fill="var(--f1-bg)" stroke="var(--f1-st)" stroke-width="1"/>
  <text x="81" y="204" class="g-lbl" fill="var(--f1-tx)">feature/*</text>
  <text x="24" y="226" class="g-sub">Historias de usuario</text>

  <!-- Guías base -->
  <line x1="175" y1="80"  x2="965" y2="80"  stroke="var(--track)" stroke-width="2"/>
  <line x1="175" y1="140" x2="965" y2="140" stroke="var(--track)" stroke-width="2"/>

  <!-- Flujo animado en main -->
  <line x1="205" y1="80" x2="925" y2="80" stroke="var(--main-st)" stroke-width="2.5" class="g-flow-m" opacity="0.8"/>

  <!-- Bifurcación main -> develop -->
  <path d="M 210 80 C 235 80, 235 140, 265 140" fill="none" stroke="var(--dev-st)" stroke-width="2.4" class="g-flow-d"/>

  <!-- Flujo en develop -->
  <line x1="265" y1="140" x2="875" y2="140" stroke="var(--dev-st)" stroke-width="2.8" class="g-flow-d"/>

  <!-- Feature 1 -->
  <path d="M 290 140 C 310 140, 310 200, 332 200 L 420 200 C 442 200, 442 140, 462 140" fill="none" stroke="var(--f1-st)" stroke-width="2.2" class="g-flow-f"/>
  <circle class="g-c1" cx="352" cy="200" r="6" fill="var(--f1-st)" stroke="var(--bg)" stroke-width="2"/>
  <circle class="g-c2" cx="400" cy="200" r="6" fill="var(--f1-st)" stroke="var(--bg)" stroke-width="2"/>
  <text x="376" y="220" class="g-node-t">feature/ui-figma</text>

  <!-- Feature 2 -->
  <path d="M 500 140 C 520 140, 520 200, 542 200 L 650 200 C 672 200, 672 140, 692 140" fill="none" stroke="var(--f2-st)" stroke-width="2.2" class="g-flow-f"/>
  <circle class="g-c2" cx="568" cy="200" r="6" fill="var(--f2-st)" stroke="var(--bg)" stroke-width="2"/>
  <circle class="g-c3" cx="624" cy="200" r="6" fill="var(--f2-st)" stroke="var(--bg)" stroke-width="2"/>
  <text x="596" y="220" class="g-node-t">feature/identity-rbac</text>

  <!-- Feature 3 -->
  <path d="M 720 140 C 740 140, 740 200, 760 200 L 818 200 C 838 200, 838 140, 858 140" fill="none" stroke="var(--f3-st)" stroke-width="2.2" class="g-flow-f"/>
  <circle class="g-c1" cx="789" cy="200" r="6" fill="var(--f3-st)" stroke="var(--bg)" stroke-width="2"/>
  <text x="789" y="220" class="g-node-t">style/readme-brand</text>

  <!-- Merge develop -> main -->
  <path d="M 875 140 C 898 140, 898 80, 922 80" fill="none" stroke="var(--main-st)" stroke-width="2.2" class="g-flow-m" opacity="0.85"/>

  <!-- Nodos main -->
  <circle cx="210" cy="80" r="7.5" fill="var(--main-st)" stroke="var(--bg)" stroke-width="2"/><text x="210" y="64" class="g-node-t">v1.0 &#183; SP1</text>
  <circle cx="535" cy="80" r="7"   fill="var(--main-st)" stroke="var(--bg)" stroke-width="2"/><text x="535" y="64" class="g-node-t">v2.0 &#183; SP2</text>
  <circle cx="922" cy="80" r="7.5" fill="var(--main-st)" stroke="var(--bg)" stroke-width="2"/><text x="922" y="64" class="g-node-t">Release SP3</text>

  <!-- Nodos develop -->
  <circle cx="265" cy="140" r="6.5" fill="var(--dev-st)" stroke="var(--bg)" stroke-width="2"/>
  <circle cx="462" cy="140" r="7"   fill="var(--dev-st)" stroke="var(--bg)" stroke-width="2"/>
  <circle cx="692" cy="140" r="7"   fill="var(--dev-st)" stroke="var(--bg)" stroke-width="2"/>

  <!-- HEAD develop -->
  <circle class="g-head-ring" cx="875" cy="140" r="7" fill="var(--dev-st)"/>
  <circle cx="875" cy="140" r="7.5" fill="var(--dev-st)" stroke="#FFFFFF" stroke-width="2"/>
  <text x="875" y="162" class="g-node-t" style="fill: var(--dev-tx);">HEAD</text>
</svg>
